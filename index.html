  /* ── 1. FIREBASE LOAD & DELTA SAVE ── */
  useEffect(()=>{
    async function load(){
      try{
        const [mSnap, rSnap, pSnap] = await Promise.all([COL_MEMBERS().get(), COL_RELATIONSHIPS().get(), COL_POSITIONS().get()]);
        if(mSnap.empty){
          // First Time Setup - Upload Blueprint
          const batch=db.batch();
          SP.forEach(p=>batch.set(COL_MEMBERS().doc(p.id), p));
          SR.forEach(r=>batch.set(COL_RELATIONSHIPS().doc(r.id), r));
          Object.entries(SPOS).forEach(([id,xy])=>batch.set(COL_POSITIONS().doc(id), xy));
          await batch.commit();
          setPeople(SP); setRels(SR); setPos(SPOS);
          SP.forEach(p=>{lastSyncedPeople.current[p.id]=p;});
          SR.forEach(r=>{lastSyncedRels.current[r.id]=r;});
          Object.entries(SPOS).forEach(([id,xy])=>{lastSyncedPos.current[id]=xy;});
        } else {
          const loadedPeople=mSnap.docs.map(d=>d.data());
          const loadedRels=rSnap.docs.map(d=>d.data());
          const loadedPos={}; pSnap.docs.forEach(d=>{loadedPos[d.id]=d.data();});
          setPeople(loadedPeople); setRels(loadedRels); setPos(loadedPos);
          loadedPeople.forEach(p=>{lastSyncedPeople.current[p.id]=p;});
          loadedRels.forEach(r=>{lastSyncedRels.current[r.id]=r;});
          Object.entries(loadedPos).forEach(([id,xy])=>{lastSyncedPos.current[id]=xy;});
        }
      }catch(err){
        console.error('Offline Mode', err);
        setPeople(SP); setRels(SR); setPos(SPOS);
      }finally{
        setLoading(false);
        setTimeout(autoCamera, 100);
      }
    }
    load();
  },[]);

  useEffect(()=>{
    if(!people.length)return;
    if(isFirstLoad.current){isFirstLoad.current=false;return;}
    setSaveStatus('syncing');
    if(saveTimer.current)clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(async()=>{
      try{
        const batch=db.batch(); let changes=0;
        const currentPeopleMap={}; people.forEach(p=>{currentPeopleMap[p.id]=p;});
        people.forEach(p=>{
          const prev=lastSyncedPeople.current[p.id];
          if(!prev||JSON.stringify(prev)!==JSON.stringify(p)){ batch.set(COL_MEMBERS().doc(p.id), p); changes++; }
        });
        Object.keys(lastSyncedPeople.current).forEach(id=>{
          if(!currentPeopleMap[id]){ batch.delete(COL_MEMBERS().doc(id)); changes++; }
        });

        const currentRelsMap={}; rels.forEach(r=>{currentRelsMap[r.id]=r;});
        rels.forEach(r=>{
          const prev=lastSyncedRels.current[r.id];
          if(!prev||JSON.stringify(prev)!==JSON.stringify(r)){ batch.set(COL_RELATIONSHIPS().doc(r.id), r); changes++; }
        });
        Object.keys(lastSyncedRels.current).forEach(id=>{
          if(!currentRelsMap[id]){ batch.delete(COL_RELATIONSHIPS().doc(id)); changes++; }
        });

        Object.entries(pos).forEach(([id,xy])=>{
          const prev=lastSyncedPos.current[id];
          if(!prev||prev.x!==xy.x||prev.y!==xy.y){ batch.set(COL_POSITIONS().doc(id), xy); changes++; }
        });
        Object.keys(lastSyncedPos.current).forEach(id=>{
          if(!pos[id]){ batch.delete(COL_POSITIONS().doc(id)); changes++; }
        });

        if(changes>0) await batch.commit();
        people.forEach(p=>{lastSyncedPeople.current[p.id]=p;});
        Object.keys(lastSyncedPeople.current).forEach(id=>{if(!currentPeopleMap[id])delete lastSyncedPeople.current[id];});
        rels.forEach(r=>{lastSyncedRels.current[r.id]=r;});
        Object.keys(lastSyncedRels.current).forEach(id=>{if(!currentRelsMap[id])delete lastSyncedRels.current[id];});
        Object.entries(pos).forEach(([id,xy])=>{lastSyncedPos.current[id]=xy;});
        Object.keys(lastSyncedPos.current).forEach(id=>{if(!pos[id])delete lastSyncedPos.current[id];});
        setSaveStatus('saved');
      }catch(err){ setSaveStatus('error'); }
    },1500);
  },[people,rels,pos]);

  function autoCamera(){
    if(!vpRef.current)return;
    const isMobile = window.innerWidth < 600;
    const scale = isMobile ? 0.35 : 0.6;
    const rootP = pos['p_ksr'] || {x:1200, y:0};
    setVt({ s: scale, x: (window.innerWidth/2) - (rootP.x * scale), y: (window.innerHeight/4) - (rootP.y * scale) });

  /* ── 2. PAN & ZOOM CONTROLS ── */
  const vtRef=useRef(vt); useEffect(()=>{vtRef.current=vt;},[vt]);
  function vpDown(e){if(e.target!==vpRef.current)return;panning.current=true;panStart.current={x:e.clientX-vt.x,y:e.clientY-vt.y};}
  function vpMove(e){
    if(dragging.current){ e.preventDefault(); setPos(p=>({...p,[dragging.current]:{x:e.clientX/vt.s-dragOff.current.x,y:(e.clientY-56)/vt.s-dragOff.current.y}})); return; }
    if(panning.current) setVt(t=>({...t,x:e.clientX-panStart.current.x,y:e.clientY-panStart.current.y}));
  }
  function vpUp(){panning.current=false;dragging.current=null;}
  useEffect(()=>{
    const el=vpRef.current; if(!el)return;
    function onWheel(e){
      e.preventDefault();
      const t=vtRef.current, f=e.deltaY<0?1.1:0.9;
      const ns=Math.min(Math.max(t.s*f,0.15),3);
      const rect=el.getBoundingClientRect(), mx=e.clientX-rect.left, my=e.clientY-rect.top;
      setVt({s:ns, x:mx-(mx-t.x)*(ns/t.s), y:my-(my-t.y)*(ns/t.s)});
    }
    el.addEventListener('wheel',onWheel,{passive:false});
    return()=>el.removeEventListener('wheel',onWheel);
  },[]);
  function nodeDown(e,id){if(!isAdmin)return;e.stopPropagation();dragging.current=id;const p=pos[id]||{x:0,y:0};dragOff.current={x:e.clientX/vt.s-p.x,y:(e.clientY-56)/vt.s-p.y};}

  /* ── 3. DATA HELPERS ── */
  const visibleIds = useMemo(()=>new Set(people.map(p=>p.id)),[people]);

  function getActiveParents(pid){ return rels.filter(r=>r.type==='parent-child'&&r.isActive&&r.pids[r.pids.length-1]===pid).flatMap(r=>r.pids.slice(0,-1)); }
  function getPartners(pid){ return rels.filter(r=>r.type==='married'&&r.pids.includes(pid)).flatMap(r=>r.pids.filter(x=>x!==pid)); }
  function getChildren(pid){ return rels.filter(r=>r.type==='parent-child'&&r.pids.slice(0,-1).includes(pid)).map(r=>r.pids[r.pids.length-1]); }

  /* ── 4. ORTHOGONAL LINES (Fase 4 & Elevasi Poligami) ── */
  function buildOrthogonalLines(){
    const lines=[], drawn=new Set();
    rels.forEach(r=>{
      if(r.type==='married'){
        const [a,b] = r.pids; const pa=pos[a], pb=pos[b]; if(!pa||!pb) return;
        const key = [a,b].sort().join('-'); if(drawn.has(key)) return; drawn.add(key);
        const x1=CX(pa), y1=CY(pa), x2=CX(pb), y2=CY(pb);
        lines.push({rid:r.id, d:`M${x1},${y1} L${x2},${y2}`, stroke:'#c8a870', dash:'6 4', w:2.5, mx:(x1+x2)/2, my:(y1+y2)/2, label:'Pasangan', type:'married'});
      }
      if(r.type==='parent-child' && r.isActive){
        const pids = r.pids.slice(0,-1), cid = r.pids[r.pids.length-1];
        const pc=pos[cid]; if(!pc) return;
        const valid = pids.filter(x=>pos[x]); if(!valid.length) return;
        
        const sx = valid.reduce((s,x)=>s+CX(pos[x]),0)/valid.length;
        const sy = valid.reduce((s,x)=>s+CY(pos[x]),0)/valid.length;
        
        // Elevasi Garis Siku (Menghindari tabrakan garis half-sibling)
        let spouseOffset = 0;
        const spouseParent = pids.map(id=>people.find(p=>p.id===id)).find(p=>p && p.isBlood===false);
        if (spouseParent && spouseParent.spouseOrder) spouseOffset = spouseParent.spouseOrder;
        
        const dropDepth = 25 + (spouseOffset * 15); // Semakin besar spouseOrder, semakin dalam turunnya
        const midY = sy + (CH/2) + dropDepth; 
        const ex = CX(pc), ey = CY(pc) - (CH/2);
        
        lines.push({rid:r.id, d:`M${sx},${sy} L${sx},${midY} L${ex},${midY} L${ex},${ey}`, stroke:'#90a8b8', dash:undefined, w:2, mx:ex, my:midY, label:'Orang tua → Anak', type:'parent-child'});
      }
    });
    return lines;
  }
  const lines = buildOrthogonalLines();

  /* ── 5. FASE 3 LOGIC: ADD & RELATION (No Regex) ── */
  function addPerson(){
    const tempNumber = String(Date.now()).slice(-4); 
    const newPerson = {
      id: 'p_'+Date.now(), displayId: `BARU-${tempNumber}`, bani: null, isBlood: true, spouseOrder: null, ...addF
    };
    const xs=Object.values(pos).map(p=>p.x), maxX=xs.length?Math.max(...xs):200;
    setPeople(prev=>[...prev,newPerson]);
    setPos(prev=>({...prev,[newPerson.id]:{x:maxX+160,y:200}}));
    setSel(newPerson.id); setSbMode('view'); setModal(null);
    setAddF({fullName:'',nickname:'',gender:'M',status:'Hidup',notes:'',photo:''});
  }

  function commitMarriage(pid1, pid2){
    setRels(prev=>[...prev,{id:'r_'+Date.now(),type:'married',pids:[pid1,pid2],isActive:true}]);
    setPeople(prev=>{
      const p1=prev.find(p=>p.id===pid1), p2=prev.find(p=>p.id===pid2);
      if(!p1||!p2) return prev;
      const isP1New = !p1.bani || p1.bani==='BARU';
      const newcomer = isP1New ? p1 : p2; const host = isP1New ? p2 : p1;
      if(!host.bani || host.bani==='BARU') return prev;

      const spousesCount = prev.filter(p=>p.bani===host.bani && p.isBlood===false).length;
      const sOrder = spousesCount + 1;

      return prev.map(p=>{
        if(p.id===newcomer.id) return {...p, bani:host.bani, isBlood:false, spouseOrder:sOrder, displayId:`${host.displayId}-S${sOrder}`};
        return p;
      });
    });
  }

  function commitRel(parentIds, childId){
    setRels(prev=>[...prev,{id:'r_'+Date.now(),type:'parent-child',pids:[...parentIds,childId],isActive:true}]);
    setPeople(prev=>{
      const child=prev.find(p=>p.id===childId);
      const hostParent=parentIds.map(id=>prev.find(p=>p.id===id)).find(p=>p&&p.isBlood===true);
      if(!child || !hostParent || !hostParent.bani) return prev;

      const bloodsInBani = prev.filter(p=>p.bani===hostParent.bani && p.isBlood===true).length;
      const childNum = String(bloodsInBani+1).padStart(3,'0');

      return prev.map(p=>{
        if(p.id===child.id) return {...p, bani:hostParent.bani, isBlood:true, displayId:`${hostParent.bani}-${childNum}`};
        return p;
      });
    });
  }

  function prepareAddRel(){
    if(!relF.pid||!sel)return;
    if(relF.type==='married') commitMarriage(sel, relF.pid);
    else if(relF.type==='child-of') commitRel([relF.pid], sel); // simplified single parent assign
    else commitRel([sel], relF.pid);
    setRelF({type:'married',pid:'',isActive:true}); setModal(null);
  }

  /* ── 6. DYNAMIC AUTO-LAYOUT (Smart Scaling) ── */
  function computeAutoLayout(){
    const GAP_X=50, GAP_Y=200;
    const root = people.find(p=>p.displayId==='KSR-000'); if(!root){setModal(null);return;}
    
    // Gen Map
    const genMap={}; const queue=[root.id]; genMap[root.id]=0;
    while(queue.length){
      const cur=queue.shift(); const g=genMap[cur];
      rels.filter(r=>r.type==='married'&&r.pids.includes(cur)).forEach(r=>r.pids.forEach(pid=>{if(!(pid in genMap)){genMap[pid]=g;queue.push(pid);}}));
      rels.filter(r=>r.type==='parent-child'&&r.isActive&&r.pids.slice(0,-1).includes(cur)).forEach(r=>{
        const cid=r.pids[r.pids.length-1]; if(!(cid in genMap)){genMap[cid]=g+1;queue.push(cid);}
      });
    }

    function getSpouses(pid){
      return rels.filter(r=>r.type==='married'&&r.pids.includes(pid)).map(r=>r.pids.find(x=>x!==pid)).map(id=>people.find(p=>p.id===id)).filter(Boolean).sort((a,b)=>(a.spouseOrder||99)-(b.spouseOrder||99));
    }
    function getBloodChildren(pid){ return rels.filter(r=>r.type==='parent-child'&&r.isActive&&r.pids.slice(0,-1).includes(pid)).map(r=>r.pids[r.pids.length-1]); }

    // Width Calc
    function subtreeWidth(pid, visited=new Set()){
      if(visited.has(pid)) return CW; visited.add(pid);
      const spouses=getSpouses(pid);
      const selfW = CW*(1+spouses.length) + GAP_X*spouses.length;
      const children=getBloodChildren(pid);
      if(!children.length) return selfW;
      const childTotal = children.reduce((s,cid)=>s+subtreeWidth(cid,new Set([...visited])),0) + (children.length-1)*GAP_X;
      return Math.max(selfW, childTotal);
    }

    const newPos={};
    function layoutSubtree(pid, centerX, gen, visited=new Set()){
      if(visited.has(pid)) return; visited.add(pid);
      const yPos = gen*GAP_Y;
      const spouses = getSpouses(pid), children = getBloodChildren(pid);

      function placeUnit(selfCX){
        const totalUnit = CW*(1+spouses.length) + GAP_X*spouses.length;
        let ux = selfCX - totalUnit/2;
        const s1 = spouses.filter(s=>s.spouseOrder===1);
        const s2 = spouses.filter(s=>s.spouseOrder>1);
        
        s1.forEach(sp=>{ newPos[sp.id]={x:Math.round(ux), y:Math.round(yPos)}; ux+=CW+GAP_X; });
        newPos[pid]={x:Math.round(ux), y:Math.round(yPos)}; ux+=CW+GAP_X;
        s2.forEach(sp=>{ newPos[sp.id]={x:Math.round(ux), y:Math.round(yPos)}; ux+=CW+GAP_X; });
      }

      if(!children.length){ placeUnit(centerX); return; }
      const widths = children.map(cid=>subtreeWidth(cid, new Set([pid])));
      const totalChildW = widths.reduce((s,w)=>s+w,0) + (children.length-1)*GAP_X;
      let cx = centerX - totalChildW/2;
      children.forEach((cid,i)=>{
        const w=widths[i]; layoutSubtree(cid, cx+w/2, gen+1, new Set([...visited])); cx+=w+GAP_X;
      });
      const lcx = newPos[children[0]]?newPos[children[0]].x+CW/2 : centerX;
      const rcx = newPos[children[children.length-1]]?newPos[children[children.length-1]].x+CW/2 : centerX;
      placeUnit((lcx+rcx)/2);
    }

    const w = subtreeWidth(root.id);
    layoutSubtree(root.id, w/2, 0);
    setPos(newPos);
    setTimeout(autoCamera, 100); setModal(null);
  }

  /* ── 7. UI RENDERERS ── */
  const baniTitle = useMemo(()=>{
    if(!selP || !selP.bani || selP.bani==='KSR') return 'Bani Kasirin';
    return `Bani ${selP.bani}`;
  },[selP]);

  const searchRes=searchQ.length>1?people.filter(p=>p.fullName.toLowerCase().includes(searchQ.toLowerCase())||(p.nickname&&p.nickname.toLowerCase().includes(searchQ.toLowerCase()))).slice(0,8):[];
  function focusPerson(id){ setSel(id); setSbMode('view'); setSearchQ(''); setShowSR(false); const p=pos[id]; if(p&&vpRef.current) setVt({s:1,x:(window.innerWidth/2)-CX(p),y:(window.innerHeight/2)-CY(p)}); }

  return <>
    {loading && <div className="loading-screen"><div className="loading-spinner"/><h3>Memuat Silsilah...</h3></div>}

    <div className="topbar">
      <div>
        <div className="brand-name">{baniTitle}</div>
        <div className="brand-sub">Silsilah Keluarga</div>
      </div>
      <div className="sep"/>
      <div className="search-wrap hide-mob">
        <input placeholder="Cari nama..." value={searchQ} onChange={e=>{setSearchQ(e.target.value);setShowSR(true);}} onFocus={()=>setShowSR(true)}/>
      </div>
      <div className="spacer"/>
      {isAdmin&&<button className="btn accent" onClick={()=>setModal('autolayout')}>⊞ Rapikan</button>}
      {isAdmin&&<button className="btn" onClick={()=>setModal('addperson')}>+ Orang</button>}
      <button className="btn hide-mob" onClick={()=>setModal('registry')}>🪪 Registry</button>
      <button className={`btn ${isAdmin?'primary':''}`} onClick={()=>isAdmin?setIsAdmin(false):setModal('pin')}>{isAdmin?'Admin Aktif':'Login'}</button>
    </div>

    {showSR&&searchRes.length>0&&<>
      <div className="sresults" style={{left:160}}>
        {searchRes.map(p=>(
          <div key={p.id} className="sitem" onClick={()=>focusPerson(p.id)}>
            <div className="pi-dot" style={{background:MC(p.gender)}}/>
            <div><span style={{fontWeight:700}}>{nn(p)}</span><div style={{color:'#8a8278',fontSize:10}}>{p.displayId}</div></div>
          </div>
        ))}
      </div>
      <div style={{position:'fixed',inset:0,zIndex:185}} onClick={()=>setShowSR(false)}/>
    </>}

    <div id="vp" ref={vpRef} onMouseDown={vpDown} onMouseMove={vpMove} onMouseUp={vpUp} onMouseLeave={vpUp} onClick={e=>{if(e.target===vpRef.current){setSel(null);setEdgeSel(null);}}}>
      <div id="world" style={{transform:`translate(${vt.x}px,${vt.y}px) scale(${vt.s})`}}>
        <svg id="csvg">
          {lines.map((l,i)=>(
            <g key={i}>
              <path d={l.d} stroke={l.stroke} strokeWidth={l.w} strokeDasharray={l.dash} fill="none" strokeLinecap="round" strokeLinejoin="round" style={{pointerEvents:'none'}}/>
              {isAdmin&&<path d={l.d} stroke="transparent" strokeWidth={18} fill="none" style={{cursor:'pointer'}} onClick={e=>{e.stopPropagation();setEdgeSel(l);}}/>}
            </g>
          ))}
        </svg>

        {people.map(p=>{
          const pp=pos[p.id]; if(!pp) return null;
          return (
            <div key={p.id} className="node" style={{left:pp.x, top:pp.y, width:CW}} onMouseDown={e=>nodeDown(e,p.id)} onClick={e=>{e.stopPropagation();setSel(p.id);setSbMode('view');setEdgeSel(null);}}>
              <div className={`card ${p.status==='Wafat'?'wafat':''} ${sel===p.id?'sel':''}`}>
                <div className="gaccent" style={{background:MC(p.gender)}}/>
                <div className="avatar" style={{background:MB(p.gender)}}><span style={{color:MC(p.gender)}}>{ini(p.fullName)}</span></div>
                <div className="card-nick">{nn(p)}</div>
                {p.status==='Wafat'&&<div style={{fontSize:9, color:'#8a8278', marginTop:2, fontWeight:700}}>Wafat</div>}
              </div>
            </div>
          );
        })}
      </div>

      {edgeSel&&isAdmin&&(
        <div className="edge-popup" style={{left:Math.min(edgeSel.mx*vt.s+vt.x, window.innerWidth-250), top:Math.min(edgeSel.my*vt.s+vt.y+56, window.innerHeight-150)}} onClick={e=>e.stopPropagation()}>
          <h4>Edit Relasi</h4>
          <div className="edge-info">Jenis: <strong>{edgeSel.label}</strong></div>
          <div style={{display:'flex',gap:6}}>
            <button className="btn danger" style={{fontSize:11}} onClick={()=>{setRels(prev=>prev.filter(r=>r.id!==edgeSel.rid));setEdgeSel(null);}}>Hapus Relasi</button>
            <button className="btn" style={{fontSize:11}} onClick={()=>setEdgeSel(null)}>Tutup</button>
          </div>
        </div>
      )}
    </div>

    {/* SIDEBAR */}
    <div className={`sidebar ${sel?'open':''}`}>
      {selP&&sbMode==='view'&&<>
        <div className="sb-head">
          <h2>Profil</h2>
          {isAdmin&&<><button className="btn" style={{fontSize:11,padding:'5px 10px'}} onClick={()=>{setEditF({...selP});setSbMode('edit');}}>Edit</button>
          <button className="btn danger" style={{fontSize:11,padding:'5px 10px'}} onClick={()=>setModal('delconfirm')}>Hapus</button></>}
          <button className="btn" style={{fontSize:11,padding:'5px 10px'}} onClick={()=>setSel(null)}>✕</button>
        </div>
        <div className="sb-body">
          <div className="profile-hero">
            <div className="profile-avatar" style={{background:MB(selP.gender)}}><span style={{color:MC(selP.gender)}}>{ini(selP.fullName)}</span></div>
            <div className="profile-nick">{nn(selP)}</div>
            <div className="profile-fullname">{selP.fullName}</div>
            <div className="profile-tags">
              <span className="tag-badge" style={{background:MB(selP.gender),color:MC(selP.gender)}}>{selP.gender==='M'?'Laki-laki':'Perempuan'}</span>
              <span className="tag-badge" style={{background:'#f4f2ef',color:'#8a8278'}}>{selP.displayId}</span>
            </div>
          </div>
          <div className="sec"><div className="sec-title">Keluarga</div>
            <div className="info-row"><span className="info-label">Orang Tua</span><span className="info-val">{getActiveParents(selP.id).map(id=>nn(people.find(p=>p.id===id))).join(' & ')||'-'}</span></div>
            <div className="info-row"><span className="info-label">Pasangan</span><span className="info-val">{getPartners(selP.id).map(id=>nn(people.find(p=>p.id===id))).join(', ')||'-'}</span></div>
            <div className="info-row"><span className="info-label">Anak</span><span className="info-val">{getChildren(selP.id).map(id=>nn(people.find(p=>p.id===id))).join(', ')||'-'}</span></div>
          </div>
          {selP.notes&&<div className="sec"><div className="sec-title">Catatan</div><div className="info-val">{selP.notes}</div></div>}
          {isAdmin&&<button className="btn primary" style={{width:'100%',marginTop:10}} onClick={()=>{setRelF({...relF,pid:''});setModal('addrel');}}>+ Tambah Relasi</button>}
        </div>
      </>}
      {selP&&sbMode==='edit'&&<>
        <div className="sb-head"><h2>Edit Profil</h2><button className="btn" onClick={()=>setSbMode('view')}>Batal</button></div>
        <div className="sb-body" style={{paddingTop:20}}>
          <div className="fg"><label>Nama Lengkap</label><input value={editF.fullName} onChange={e=>setEditF({...editF,fullName:e.target.value})}/></div>
          <div className="fg"><label>Nama Panggilan</label><input value={editF.nickname} onChange={e=>setEditF({...editF,nickname:e.target.value})}/></div>
          <div className="fg"><label>Status</label><select value={editF.status} onChange={e=>setEditF({...editF,status:e.target.value})}><option>Hidup</option><option>Wafat</option><option>Cerai</option></select></div>
          <div className="frow"><button className="btn primary" onClick={saveEdit}>Simpan</button></div>
        </div>
      </>}
    </div>

    {/* MODALS */}
    {modal==='pin'&&<div className="overlay" onClick={()=>setModal(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
      <h3>Login Admin</h3><p className="modal-sub">Masukkan PIN untuk mengedit.</p>
      <div className="fg"><input type="password" value={pinVal} autoFocus onChange={e=>setPinVal(e.target.value)} onKeyDown={e=>e.key==='Enter'&&tryPin()}/>{pinErr&&<div style={{color:'red',fontSize:11}}>{pinErr}</div>}</div>
      <div className="frow"><button className="btn primary" onClick={tryPin}>Masuk</button></div>
    </div></div>}

    {modal==='addperson'&&<div className="overlay" onClick={()=>setModal(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
      <h3>Tambah Anggota Baru</h3><p className="modal-sub">ID akan terbuat otomatis saat relasi ditentukan.</p>
      <div className="fg"><label>Nama Lengkap</label><input value={addF.fullName} autoFocus onChange={e=>setAddF({...addF,fullName:e.target.value})}/></div>
      <div className="fg"><label>Panggilan</label><input value={addF.nickname} onChange={e=>setAddF({...addF,nickname:e.target.value})}/></div>
      <div className="fg"><label>Gender</label><select value={addF.gender} onChange={e=>setAddF({...addF,gender:e.target.value})}><option value="M">Laki-laki</option><option value="F">Perempuan</option></select></div>
      <div className="frow"><button className="btn primary" onClick={addPerson} disabled={!addF.fullName}>Tambah</button><button className="btn" onClick={()=>setModal(null)}>Batal</button></div>
    </div></div>}

    {modal==='addrel'&&<div className="overlay" onClick={()=>setModal(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
      <h3>Tambah Relasi</h3><p className="modal-sub">Untuk: {nn(selP)}</p>
      <div className="fg"><label>Jenis Relasi</label><select value={relF.type} onChange={e=>setRelF({...relF,type:e.target.value})}><option value="married">Pasangan / Menikah</option><option value="parent-of">Orang tua dari (Pilih Anak)</option><option value="child-of">Anak dari (Pilih Ortu)</option></select></div>
      <div className="fg"><label>Cari Orang</label><input autoFocus placeholder="Ketik nama..." value={relSearchQ} onChange={e=>setRelSearchQ(e.target.value)}/></div>
      <div className="ppicker-list">{people.filter(p=>p.id!==sel && p.fullName.toLowerCase().includes(relSearchQ.toLowerCase())).slice(0,5).map(p=>(
        <div key={p.id} className={`ppicker-item ${relF.pid===p.id?'selected':''}`} onClick={()=>setRelF({...relF,pid:p.id})}><div className="pi-dot" style={{background:MC(p.gender)}}/>{nn(p)} - <span style={{fontSize:10,color:'#8a8278'}}>{p.displayId}</span></div>
      ))}</div>
      <div className="frow"><button className="btn primary" onClick={prepareAddRel} disabled={!relF.pid}>Konfirmasi</button></div>
    </div></div>}

    {modal==='autolayout'&&<div className="overlay" onClick={()=>setModal(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
      <h3>⊞ Rapikan Otomatis</h3><p className="modal-sub">Algoritma cerdas akan menyusun ulang pohon keluargamu agar tidak tumpang tindih.</p>
      <div className="frow"><button className="btn primary" onClick={computeAutoLayout}>Rapikan Sekarang</button><button className="btn" onClick={()=>setModal(null)}>Batal</button></div>
    </div></div>}

    {modal==='delconfirm'&&<div className="overlay" onClick={()=>setModal(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
      <h3>Hapus Anggota?</h3><p className="modal-sub">Hapus {nn(selP)} secara permanen?</p>
      <div className="frow"><button className="btn danger" onClick={delPerson}>Ya, Hapus</button><button className="btn" onClick={()=>setModal(null)}>Batal</button></div>
    </div></div>}

    {modal==='registry'&&<div className="overlay" onClick={()=>{setModal(null);setRegistryFilter(null);}}><div className="modal" style={{maxWidth:460}} onClick={e=>e.stopPropagation()}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}><h3>🪪 ID Registry</h3><button className="btn" onClick={()=>setModal(null)}>✕ Tutup</button></div>
      {(()=>{
        const groups={}; people.forEach(p=>{const b=p.bani||'BARU'; groups[b]=groups[b]||[]; groups[b].push(p);});
        const baniPrefixes=Object.keys(groups).filter(k=>k!=='BARU').sort();
        return <>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:20}}>
            {baniPrefixes.map(prefix=><button key={prefix} onClick={()=>setRegistryFilter(registryFilter===prefix?null:prefix)} className={`btn ${registryFilter===prefix?'primary':''}`}>Bani {prefix} ({groups[prefix].length})</button>)}
            {groups['BARU']&&<button className="btn danger" onClick={()=>setRegistryFilter('BARU')}>Baru/Unlinked ({groups['BARU'].length})</button>}
          </div>
          {(registryFilter||baniPrefixes[0])&&(()=>{
            const activeGrp = registryFilter||baniPrefixes[0];
            const members = groups[activeGrp].sort((a,b)=>{
              if(a.isBlood!==b.isBlood) return a.isBlood?-1:1;
              if(!a.isBlood) return (a.spouseOrder||99)-(b.spouseOrder||99);
              return a.displayId.localeCompare(b.displayId);
            });
            return <table className="reg-table">
              <thead><tr><th>ID Registrasi</th><th>Nama</th><th>Status Darah</th></tr></thead>
              <tbody>{members.map(p=><tr key={p.id}>
                <td style={{fontWeight:800,fontFamily:'monospace',color:'#426b8a'}}>{p.displayId}</td>
                <td><div style={{fontWeight:700}}>{nn(p)}</div><div style={{fontSize:10,color:'#8a8278'}}>{p.fullName}</div></td>
                <td>{p.isBlood?<span className="tag-blood">Keturunan Asli</span>:<span className="tag-spouse">Pasangan (Ke-{p.spouseOrder})</span>}</td>
              </tr>)}</tbody>
            </table>
          })()}
        </>;
      })()}
    </div></div>}

    {/* CONTROLS */}
    <div className={`ctrl ${sel?'sb-open':''}`}>
      <button className="cbtn" onClick={()=>setVt(t=>({...t,s:Math.min(t.s*1.2,3)}))}>+</button>
      <button className="cbtn" onClick={()=>setVt(t=>({...t,s:Math.max(t.s*.8,0.15)}))}>−</button>
      <button className="cbtn" onClick={autoCamera} style={{fontSize:22}}>⌂</button>
    </div>
    <div className={`save-status ${sel?'hidden':''}`}><div className={`save-dot ${saveStatus}`}/>{saveStatus==='syncing'?'Menyimpan...':saveStatus==='error'?'Gagal Simpan':'Disimpan di Cloud'}</div>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
