  /* ── 1. FIREBASE LOAD ── */
  useEffect(()=>{
    async function load(){
      try{
        const [mSnap, rSnap, pSnap] = await Promise.all([COL_MEMBERS().get(), COL_RELATIONSHIPS().get(), COL_POSITIONS().get()]);
        if(mSnap.empty){
          const batch=db.batch();
          SP.forEach(p=>batch.set(COL_MEMBERS().doc(p.id), p));
          SR.forEach(r=>batch.set(COL_RELATIONSHIPS().doc(r.id), r));
          Object.entries(SPOS).forEach(([id,xy])=>batch.set(COL_POSITIONS().doc(id), xy));
          await batch.commit();
          setPeople(SP);setRels(SR);setPos({...SPOS});
          SP.forEach(p=>{lastSyncedPeople.current[p.id]=p;});
          SR.forEach(r=>{lastSyncedRels.current[r.id]=r;});
          Object.entries(SPOS).forEach(([id,xy])=>{lastSyncedPos.current[id]=xy;});
        } else {
          const loadedPeople=mSnap.docs.map(d=>d.data());
          const loadedRels=rSnap.docs.map(d=>d.data());
          const loadedPos={}; pSnap.docs.forEach(d=>{loadedPos[d.id]=d.data();});
          
          loadedPeople.forEach(p=>{lastSyncedPeople.current[p.id]=p;});
          loadedRels.forEach(r=>{lastSyncedRels.current[r.id]=r;});
          Object.entries(loadedPos).forEach(([id,xy])=>{lastSyncedPos.current[id]=xy;});

          const existingPIds = new Set(loadedPeople.map(p=>p.id));
          const newP = SP.filter(p=>!existingPIds.has(p.id));
          const mergedPeople = [...loadedPeople, ...newP];

          const existingRIds = new Set(loadedRels.map(r=>r.id));
          const newR = SR.filter(r=>!existingRIds.has(r.id));
          const mergedRels = [...loadedRels, ...newR];

          const mergedPos = { ...loadedPos };
          Object.entries(SPOS).forEach(([id,xy])=>{
            if(!mergedPos[id]) mergedPos[id] = xy;
          });

          setPeople(mergedPeople); 
          setRels(mergedRels); 
          setPos(mergedPos);
        }
      }catch(err){
        setPeople(SP);setRels(SR);setPos({...SPOS});
      } finally{
        setLoading(false);
      }
    }
    load();
  },[]);

  // V1.14 PATCH: Kamera Observer Murni (Menjamin Viewport Sempurna)
  useEffect(() => {
    if (loading || !people.length) return;
    const el = vpRef.current;
    if (!el) return;
    
    // Jika layar langsung terbaca utuh
    if (el.clientWidth > 0 && !initialLayoutDone.current) {
      initialLayoutDone.current = true;
      computeAutoLayout('p_ksr', true);
      return;
    }

    // Jika layar membandel, intai menggunakan ResizeObserver
    const observer = new ResizeObserver(entries => {
      if (entries[0].contentRect.width > 0 && !initialLayoutDone.current) {
        initialLayoutDone.current = true;
        computeAutoLayout('p_ksr', true);
        observer.disconnect();
      }
    });
    observer.observe(el);
    return () => observer.disconnect();
  }, [loading, people.length]);

  useEffect(()=>{
    if(!people.length)return;
    if(isFirstLoad.current){isFirstLoad.current=false;return;}
    setSaveStatus('syncing');
    if(saveTimer.current)clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(async()=>{
      try{
        const batch=db.batch(); let changes=0;
        const currentPeopleMap={}; people.forEach(p=>{currentPeopleMap[p.id]=p;});
        people.forEach(p=>{
          const prev=lastSyncedPeople.current[p.id];
          if(!prev||JSON.stringify(prev)!==JSON.stringify(p)){ batch.set(COL_MEMBERS().doc(p.id), p); changes++; }
        });
        Object.keys(lastSyncedPeople.current).forEach(id=>{
          if(!currentPeopleMap[id]){ batch.delete(COL_MEMBERS().doc(id)); changes++; }
        });

        const currentRelsMap={}; rels.forEach(r=>{currentRelsMap[r.id]=r;});
        rels.forEach(r=>{
          const prev=lastSyncedRels.current[r.id];
          if(!prev||JSON.stringify(prev)!==JSON.stringify(r)){ batch.set(COL_RELATIONSHIPS().doc(r.id), r); changes++; }
        });
        Object.keys(lastSyncedRels.current).forEach(id=>{
          if(!currentRelsMap[id]){ batch.delete(COL_RELATIONSHIPS().doc(id)); changes++; }
        });

        Object.entries(pos).forEach(([id,xy])=>{
          const prev=lastSyncedPos.current[id];
          if(!prev||prev.x!==xy.x||prev.y!==xy.y){ batch.set(COL_POSITIONS().doc(id), xy); changes++; }
        });
        Object.keys(lastSyncedPos.current).forEach(id=>{
          if(!pos[id]){ batch.delete(COL_POSITIONS().doc(id)); changes++; }
        });

        if(changes>0) await batch.commit();
        people.forEach(p=>{lastSyncedPeople.current[p.id]=p;});
        Object.keys(lastSyncedPeople.current).forEach(id=>{if(!currentPeopleMap[id])delete lastSyncedPeople.current[id];});
        rels.forEach(r=>{lastSyncedRels.current[r.id]=r;});
        Object.keys(lastSyncedRels.current).forEach(id=>{if(!currentRelsMap[id])delete lastSyncedRels.current[id];});
        Object.entries(pos).forEach(([id,xy])=>{lastSyncedPos.current[id]=xy;});
        Object.keys(lastSyncedPos.current).forEach(id=>{if(!pos[id])delete lastSyncedPos.current[id];});
        setSaveStatus('saved');
      }catch(err){ setSaveStatus('error'); }
    },1500);
  },[people,rels,pos]);

  async function uploadPhoto(file, personId){

      const ext=file.name.split('.').pop().toLowerCase();

      await ref.put(file);
      return await ref.getDownloadURL();

  /* ── 2. V1.14 DIRECT DOM CAMERA CONTROLS ── */
  function updateWorldTransform() {
    if (worldRef.current) {
      worldRef.current.style.transform = `translate(${vt.current.x}px, ${vt.current.y}px) scale(${vt.current.s})`;
    }
  }

  function autoCamera(rootId = focusRoot, customPos = pos){
    if(!vpRef.current || vpRef.current.clientWidth === 0) return;
    const vw=vpRef.current.clientWidth, vh=vpRef.current.clientHeight;
    const isMobile = window.innerWidth < 600;
    const scale = isMobile ? 0.35 : 0.6;
    const rootP = customPos[rootId] || {x:1200, y:0};
    vt.current = { s: scale, x: (vw/2) - (rootP.x * scale), y: (vh/4) - (rootP.y * scale) };
    updateWorldTransform();
  }

  function setZoom(factor) {
    let newS = vt.current.s * factor;
    newS = Math.min(Math.max(newS, 0.15), 4);
    if(!vpRef.current) return;
    const vw=vpRef.current.clientWidth, vh=vpRef.current.clientHeight;
    const mx = vw/2, my = vh/2;
    vt.current.x = mx - (mx - vt.current.x) * (newS / vt.current.s);
    vt.current.y = my - (my - vt.current.y) * (newS / vt.current.s);
    vt.current.s = newS;
    updateWorldTransform();
  }

  const vpTop = 52;
  function vpDown(e){if(e.target!==vpRef.current)return;panning.current=true;panStart.current={x:e.clientX-vt.current.x,y:e.clientY-vt.current.y};}
  function vpMove(e){
    if(dragging.current){ 
      e.preventDefault(); 
      setPos(p=>({...p,[dragging.current]:{x:e.clientX/vt.current.s-dragOff.current.x,y:(e.clientY-vpTop)/vt.current.s-dragOff.current.y}})); 
      return; 
    }
    if(panning.current) {
      vt.current.x = e.clientX - panStart.current.x;
      vt.current.y = e.clientY - panStart.current.y;
      updateWorldTransform(); 
    }
  }
  function vpUp(){panning.current=false;dragging.current=null;}
  
  useEffect(()=>{
    const el=vpRef.current; if(!el)return;
    function onWheel(e){
      e.preventDefault();
      const f = e.deltaY < 0 ? 1.1 : 0.9;
      const newS = Math.min(Math.max(vt.current.s * f, 0.15), 4);
      const rect = el.getBoundingClientRect(); 
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      
      vt.current.x = mx - (mx - vt.current.x) * (newS / vt.current.s);
      vt.current.y = my - (my - vt.current.y) * (newS / vt.current.s);
      vt.current.s = newS;
      updateWorldTransform();
    }
    el.addEventListener('wheel',onWheel,{passive:false});
    return()=>el.removeEventListener('wheel',onWheel);
  },[]);

  const lastTouch=useRef(null); const lastPinch=useRef(null); const touchStartPos=useRef(null); const TAP_SLOP=8; 
  function onTouchStart(e){
    const tag=e.target.tagName;
    if(tag==='BUTTON'||tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||tag==='A')return;
    if(e.target.closest('.sidebar,.modal,.overlay,.ctrl,.legend,.statpill,.topbar,.sresults,.edge-popup,.drill-btn,.focus-banner'))return;

    if(e.touches.length===1){
      const t=e.touches[0];
      touchStartPos.current={x:t.clientX,y:t.clientY};
      lastTouch.current={x:t.clientX-vt.current.x,y:t.clientY-vt.current.y};
      lastPinch.current=null;
    } else if(e.touches.length>=2){
      e.preventDefault(); 
      const t0=e.touches[0],t1=e.touches[1];
      const dx=t0.clientX-t1.clientX, dy=t0.clientY-t1.clientY;
      lastPinch.current={
        dist:Math.hypot(dx,dy), s:vt.current.s, x:vt.current.x, y:vt.current.y,
        mx:(t0.clientX+t1.clientX)/2, my:(t0.clientY+t1.clientY)/2,
      };
      lastTouch.current=null; touchStartPos.current=null;
    }
  }
  function onTouchMove(e){
    if(e.touches.length===1&&lastTouch.current){
      const t=e.touches[0]; const sp=touchStartPos.current;
      const moved=sp?Math.hypot(t.clientX-sp.x,t.clientY-sp.y):TAP_SLOP+1;
      if(moved<TAP_SLOP)return;
      e.preventDefault();
      const nx = t.clientX - lastTouch.current.x; 
      const ny = t.clientY - lastTouch.current.y;
      if(isFinite(nx)&&isFinite(ny)) {
        vt.current.x = nx; vt.current.y = ny;
        updateWorldTransform();
      }
    } else if(e.touches.length>=2&&lastPinch.current){
      e.preventDefault();
      const t0=e.touches[0],t1=e.touches[1];
      const dx=t0.clientX-t1.clientX, dy=t0.clientY-t1.clientY;
      const dist=Math.hypot(dx,dy); if(!dist)return;
      const ratio=dist/lastPinch.current.dist;
      const ns=Math.min(Math.max(lastPinch.current.s*ratio,0.15),4);
      const {mx,my,x:ox,y:oy,s:os}=lastPinch.current;
      const nx=mx-(mx-ox)*(ns/os); const ny=my-(my-oy)*(ns/os);
      if(isFinite(ns)&&isFinite(nx)&&isFinite(ny)) {
        vt.current.s = ns; vt.current.x = nx; vt.current.y = ny;
        updateWorldTransform();
      }
    }
  }
  function onTouchEnd(e){
    if(e.touches.length===0){ lastTouch.current=null;lastPinch.current=null;touchStartPos.current=null; } 
    else if(e.touches.length===1){
      const t=e.touches[0];
      lastTouch.current={x:t.clientX-vt.current.x,y:t.clientY-vt.current.y};
      lastPinch.current=null; touchStartPos.current={x:t.clientX,y:t.clientY};
    }
  }
  useEffect(()=>{
    const el=vpRef.current;if(!el)return;
    el.addEventListener('touchstart',onTouchStart,{passive:false});
    el.addEventListener('touchmove',onTouchMove,{passive:false});
    el.addEventListener('touchend',onTouchEnd,{passive:true});
    return()=>{ el.removeEventListener('touchstart',onTouchStart); el.removeEventListener('touchmove',onTouchMove); el.removeEventListener('touchend',onTouchEnd); };
  },[]);

  function nodeDown(e,id){if(!isAdmin)return;e.stopPropagation();dragging.current=id;const p=pos[id]||{x:0,y:0};dragOff.current={x:e.clientX/vt.current.s-p.x,y:(e.clientY-vpTop)/vt.current.s-p.y};}

  /* ── 3. DATA HELPERS ── */
  function getActiveParents(pid){ 
    const rs = rels.filter(r=>r.type==='parent-child'&&r.isActive&&r.pids[r.pids.length-1]===pid);
    return [...new Set(rs.reduce((acc, r) => acc.concat(r.pids.slice(0,-1)), []))];
  }
  function getBioParents(pid){ 
    const rs = rels.filter(r=>r.type==='parent-child'&&!r.isActive&&r.pids[r.pids.length-1]===pid);
    return [...new Set(rs.reduce((acc, r) => acc.concat(r.pids.slice(0,-1)), []))];
  }
  function isAdopted(pid){ return rels.some(r=>r.type==='parent-child'&&!r.isActive&&r.pids[r.pids.length-1]===pid)&&rels.some(r=>r.type==='parent-child'&&r.isActive&&r.pids[r.pids.length-1]===pid); }
  function getActiveChildren(pid){ return rels.filter(r=>r.type==='parent-child'&&r.isActive&&r.pids.slice(0,-1).includes(pid)).map(r=>r.pids[r.pids.length-1]); }
  
  function getPartners(pid){ 
    const rs = rels.filter(r=>r.type==='married'&&r.pids.includes(pid));
    return [...new Set(rs.reduce((acc, r) => acc.concat(r.pids.filter(x=>x!==pid)), []))];
  }
  
  function getActivePartner(pid){
    const marriages=rels.filter(r=>r.type==='married'&&r.pids.includes(pid));
    for(const m of marriages){
      const other=m.pids.find(x=>x!==pid);
      const op=people.find(p=>p.id===other);
      if(op&&op.status!=='Cerai') return other;
    }
    return marriages[0]?.pids.find(x=>x!==pid)||null;
  }
  
  function getSiblings(pid){
    const sibs=new Set();
    const myParents=new Set([...getActiveParents(pid),...getBioParents(pid)]);
    if(myParents.size===0) return [];
    rels.forEach(r=>{
      if(r.type==='parent-child'){
        const parents=r.pids.slice(0,-1), child=r.pids[r.pids.length-1];
        if(child===pid) return;
        if(parents.some(p=>myParents.has(p))) sibs.add(child);
      }
    });
    return [...sibs];
  }

  function getChildrenForDisplay(pid){
    const inactiveOnly=[...new Set(rels.filter(r=>r.type==='parent-child'&&!r.isActive&&r.pids.slice(0,-1).includes(pid)).map(r=>r.pids[r.pids.length-1]))];
    const act=[...new Set(getActiveChildren(pid))];
    const shown=new Set([...inactiveOnly,...act]);
    return [...shown].map(cid=>({
      id:cid,
      tag:inactiveOnly.includes(cid)&&!act.includes(cid)?'biologis': !inactiveOnly.includes(cid)&&act.includes(cid)&&isAdopted(cid)?'asuh': undefined
    }));
  }

  const isVisibleNode = useMemo(() => {
    const vis = new Set();
    if(!people.length) return vis;
    
    const rootTarget = focusRoot || 'p_ksr';
    const isHome = rootTarget === 'p_ksr';
    
    const depths = { [rootTarget]: 0 };
    const queue = [rootTarget];
    
    while(queue.length) {
      const curr = queue.shift();
      const currentDepth = depths[curr];
      
      if(isHome && currentDepth > 1) continue; 
      
      vis.add(curr);
      
      getPartners(curr).forEach(sp => {
        if(depths[sp] === undefined) {
          depths[sp] = currentDepth;
          vis.add(sp);
        }
      });
      
      getActiveChildren(curr).forEach(c => {
        if(depths[c] === undefined) {
          depths[c] = currentDepth + 1;
          queue.push(c);
        }
      });
    }
    
    if(isHome){
      people.forEach(p => {
         if(p.displayId === 'KSR-000') return;
         const parents = getActiveParents(p.id);
         const spouses = getPartners(p.id); 
         if(parents.length === 0 && spouses.length === 0 && (p.isBlood === true || p.bani === 'BARU')) {
           vis.add(p.id); 
         }
      });
    }
    return vis;
  }, [people, rels, focusRoot]);

  /* ── 4. GARIS SIKU (ORTHOGONAL) ── */
  function buildOrthogonalLines(){
    const lines=[], drawn=new Set();
    rels.forEach(r=>{
      if(r.type==='married'){
        const [a,b] = r.pids; const pa=pos[a], pb=pos[b]; if(!pa||!pb) return;
        if(!isVisibleNode.has(a)||!isVisibleNode.has(b)) return;
        const key = [a,b].sort().join('-'); if(drawn.has(key)) return; drawn.add(key);
        const x1=CX(pa), y1=CY(pa), x2=CX(pb), y2=CY(pb);
        lines.push({rid:r.id, d:`M${x1},${y1} L${x2},${y2}`, stroke:'#c8a870', dash:'6 4', w:2.5, mx:(x1+x2)/2, my:(y1+y2)/2, label:'Pasangan', type:'married', active:true});
      }
      if(r.type==='parent-child' && r.isActive){
        const pids = r.pids.slice(0,-1), cid = r.pids[r.pids.length-1];
        const pc=pos[cid]; if(!pc) return;
        if(!isVisibleNode.has(cid)) return;
        if(pids.some(pid => !isVisibleNode.has(pid))) return;

        const valid = pids.filter(x=>pos[x]&&isVisibleNode.has(x)); if(!valid.length) return;
        
        const sx = valid.reduce((s,x)=>s+CX(pos[x]),0)/valid.length;
        const sy = valid.reduce((s,x)=>s+CY(pos[x]),0)/valid.length;
        
        let spouseOffset = 0;
        const spouseParent = pids.map(id=>people.find(p=>p.id===id)).find(p=>p && p.isBlood===false);
        if (spouseParent && spouseParent.spouseOrder) spouseOffset = spouseParent.spouseOrder;
        
        const dropDepth = 25 + (spouseOffset * 15); 
        const midY = sy + (CH/2) + dropDepth; 
        const ex = CX(pc), ey = CY(pc) - (CH/2);
        
        lines.push({rid:r.id, d:`M${sx},${sy} L${sx},${midY} L${ex},${midY} L${ex},${ey}`, stroke:'#90a8b8', dash:undefined, w:2, mx:ex, my:midY, label:'Orang tua → Anak', type:'parent-child', active:r.isActive});
      }
    });
    return lines;
  }
  const lines = buildOrthogonalLines();

  function commitMarriage(pid1, pid2){
    setRels(prev=>[...prev,{id:'r_'+Date.now(),type:'married',pids:[pid1,pid2],isActive:true}]);
    setPeople(prev=>{
      const p1=prev.find(p=>p.id===pid1), p2=prev.find(p=>p.id===pid2);
      if(!p1||!p2) return prev;
      const isP1New = !p1.bani || p1.bani==='BARU';
      const newcomer = isP1New ? p1 : p2; const host = isP1New ? p2 : p1;
      if(!host.bani || host.bani==='BARU') return prev;
      const spousesCount = prev.filter(p=>p.bani===host.bani && p.isBlood===false).length;
      const sOrder = spousesCount + 1;
      return prev.map(p=>{
        if(p.id===newcomer.id) return {...p, bani:host.bani, isBlood:false, spouseOrder:sOrder, displayId:`${host.displayId}-S${sOrder}`};
        return p;
      });
    });
  }

  function commitRel(parentIds, childId, isActive){
    setRels(prev=>[...prev,{id:'r_'+Date.now(),type:'parent-child',pids:[...parentIds,childId],isActive}]);
    setPeople(prev=>{
      const child=prev.find(p=>p.id===childId);

      if(!child || !bloodParent || !bloodParent.bani) return prev;
      if(child.bani && child.bani!=='BARU') return prev; 
      const bloodsInBani = prev.filter(p=>p.bani===bloodParent.bani && p.isBlood===true).length;
      const childNum = String(bloodsInBani+1).padStart(3,'0');
      return prev.map(p=>{
        if(p.id===child.id) return {...p, bani:bloodParent.bani, isBlood:true, displayId:`${bloodParent.bani}-${childNum}`};
        return p;
      });
    });
  }

  /* ── 6. DYNAMIC AUTO-LAYOUT ── */
  function computeAutoLayout(rootTarget = focusRoot, moveCamera = true){
    const GAP_X=40, GAP_Y=160;
    const rootId = rootTarget || 'p_ksr';
    const root = people.find(p=>p.id===rootId) || people.find(p=>p.displayId==='KSR-000'); 
    if(!root){setModal(null);return;}
    
    function getSpouses(pid){ return rels.filter(r=>r.type==='married'&&r.pids.includes(pid)).map(r=>r.pids.find(x=>x!==pid)).map(id=>people.find(p=>p.id===id)).filter(Boolean).sort((a,b)=>(a.spouseOrder||99)-(b.spouseOrder||99)); }
    function getBloodChildren(pid){ return rels.filter(r=>r.type==='parent-child'&&r.isActive&&r.pids.slice(0,-1).includes(pid)).map(r=>r.pids[r.pids.length-1]); }

    function subtreeWidth(pid, visited=new Set()){
      if(visited.has(pid)) return CW; visited.add(pid);
      const spouses=getSpouses(pid); const selfW = CW*(1+spouses.length) + GAP_X*spouses.length;
      
      if(rootTarget === 'p_ksr' && pid !== root.id && getActiveParents(pid).includes(root.id)) return selfW;

      const children=getBloodChildren(pid); if(!children.length) return selfW;
      const childTotal = children.reduce((s,cid)=>s+subtreeWidth(cid,new Set([...visited])),0) + (children.length-1)*GAP_X;
      return Math.max(selfW, childTotal);
    }

    const newPos={};
    function layoutSubtree(pid, centerX, gen, visited=new Set()){
      if(visited.has(pid)) return; visited.add(pid);
      const yPos = gen*GAP_Y;
      const spouses = getSpouses(pid), children = getBloodChildren(pid);

      function placeUnit(selfCX){
        const totalUnit = CW*(1+spouses.length) + GAP_X*spouses.length;
        let ux = selfCX - totalUnit/2;
        
        if (spouses.length === 0) {
          newPos[pid]={x:Math.round(ux), y:Math.round(yPos)};
        } else if (spouses.length === 1) {
          newPos[pid]={x:Math.round(ux), y:Math.round(yPos)};
          ux += CW + GAP_X;
          newPos[spouses[0].id]={x:Math.round(ux), y:Math.round(yPos)};
        } else {
          const s1 = spouses.filter(s=>s.spouseOrder===1);
          const s2 = spouses.filter(s=>s.spouseOrder>1);
          s1.forEach(sp=>{ newPos[sp.id]={x:Math.round(ux), y:Math.round(yPos)}; ux+=CW+GAP_X; });
          newPos[pid]={x:Math.round(ux), y:Math.round(yPos)}; ux+=CW+GAP_X;
          s2.forEach(sp=>{ newPos[sp.id]={x:Math.round(ux), y:Math.round(yPos)}; ux+=CW+GAP_X; });
        }
      }

      if(rootTarget === 'p_ksr' && gen >= 1) { placeUnit(centerX); return; }

      if(!children.length){ placeUnit(centerX); return; }
      
      const widths = children.map(cid=>subtreeWidth(cid, new Set([pid])));
      const totalChildW = widths.reduce((s,w)=>s+w,0) + (children.length-1)*GAP_X;
      let cx = centerX - totalChildW/2;
      
      const childCenters = [];
      children.forEach((cid,i)=>{
        const w=widths[i];
        const childCenter = cx + w/2;
        childCenters.push(childCenter);
        layoutSubtree(cid, childCenter, gen+1, new Set([...visited])); 
        cx+=w+GAP_X;
      });
      
      const selfCX = children.length === 1 ? childCenters[0] : (childCenters[0] + childCenters[childCenters.length-1]) / 2;
      placeUnit(selfCX);
    }

    const w = subtreeWidth(root.id);
    layoutSubtree(root.id, w/2, 0);

    if(rootId === 'p_ksr') {
      const trulyUnconnected = people.filter(p => {
         if(p.id in newPos) return false;
         if(p.displayId === 'KSR-000') return false; 
         const parents = getActiveParents(p.id);
         const spouses = getPartners(p.id);
         return parents.length === 0 && spouses.length === 0 && (p.isBlood === true || p.bani === 'BARU');
      });
      
      let ux2=0;
      const maxY=Math.max(...Object.values(newPos).map(p=>p.y), 0);
      trulyUnconnected.forEach(p=>{
        newPos[p.id]={x:Math.round(ux2), y:Math.round(maxY+GAP_Y+120)};
        ux2+=CW+GAP_X;
      });
    }

    setPos(newPos); 
    setModal(null);
    if(moveCamera) {
       setTimeout(() => autoCamera(root.id, newPos), 0);
    }
  }

            <div className="sec-title">Info</div>
            {isAdmin && selP.displayId && (
              <div className="info-row"><span className="info-label">ID Sistem</span><span className="info-val" style={{fontWeight: 700}}>{selP.displayId}</span></div>
            )}
            {fmtBirth(selP.birthPlace,selP.birthDate)&&<div className="info-row"><span className="info-label">Lahir</span><span className="info-val">{fmtBirth(selP.birthPlace,selP.birthDate)}</span></div>}
            {selP.deathDate&&<div className="info-row"><span className="info-label">Wafat</span><span className="info-val">{fmtDate(selP.deathDate)}</span></div>}
            {selP.domicile&&<div className="info-row"><span className="info-label">Domisili</span><span className="info-val">{selP.domicile}</span></div>}
            {!fmtBirth(selP.birthPlace,selP.birthDate)&&!selP.deathDate&&!selP.domicile&&!(isAdmin && selP.displayId)&&<div className="info-empty">Belum ada info detail.</div>}
          </div>

          <div className="sec"><div className="sec-title">Keluarga</div>
            <div className="info-row"><span className="info-label">Orang Tua</span><span className="info-val">
              {activeParents.length>0?<div className="chips">{activeParents.map(id=><PChip key={id} id={id}/>)}</div>:<div className="info-empty" style={{marginTop:4}}>Belum ada data.</div>}
            </span></div>
            {selP.bioNote&&<div className="bio-note">{selP.bioNote}</div>}
            
            <div className="info-row" style={{marginTop:8}}><span className="info-label">Pasangan</span><span className="info-val">
              {partners.length>0?<div className="chips">{partners.map(id=>{
                const pp=people.find(x=>x.id===id);
                const r=rels.find(r=>r.type==='married'&&r.pids.includes(id)&&r.pids.includes(sel));
                return<PChip key={id} id={id} tag={pp?.status==='Cerai'?'cerai':undefined} onRm={r?()=>removeRel(r.id):undefined}/>;
              })}</div>:<div className="info-empty" style={{marginTop:4}}>Belum ada data.</div>}
            </span></div>

            <div className="info-row" style={{marginTop:8}}><span className="info-label">Saudara</span><span className="info-val">
              {siblings.length>0?<div className="chips">{[...new Set(siblings)].map(id=><PChip key={id} id={id}/>)}</div>:<div className="info-empty" style={{marginTop:4}}>Tidak ada / belum terdata.</div>}
            </span></div>
            
            <div className="info-row" style={{marginTop:8}}><span className="info-label">Anak</span><span className="info-val">
              {childrenDisplay.length>0?<div className="chips">{childrenDisplay.map(({id,tag})=><PChip key={id} id={id} tag={tag}/>)}</div>:<div className="info-empty" style={{marginTop:4}}>Belum ada data.</div>}
            </span></div>
          </div>
          
          {selP.notes&&<div className="sec"><div className="sec-title">Catatan</div><div className="info-val" style={{fontSize:11.5,lineHeight:1.6,color:'#4a4038'}}>{selP.notes}</div></div>}
          {isAdmin&&<div style={{marginTop:16}}><button className="btn" style={{width:'100%'}} onClick={()=>{setRelF(f=>({...f,pid:''}));setRelSearchQ('');setModal('addrel');}}>+ Tambah Relasi</button></div>}
        </div>
      </>}

      {selP&&sbMode==='edit'&&<>
        <div className="sb-head"><h2 style={{fontSize:13}}>Edit Profil</h2><button className="btn" style={{padding:'4px 10px',fontSize:11}} onClick={()=>setSbMode('view')}>Batal</button></div>
        <div className="sb-body" style={{paddingTop:20}}>
          <div className="fg"><label>Nama Lengkap</label><input value={editF.fullName||''} onChange={e=>setEditF({...editF,fullName:e.target.value})}/></div>
          <div className="fg"><label>Nama Panggilan</label><input value={editF.nickname||''} onChange={e=>setEditF({...editF,nickname:e.target.value})}/></div>
          <div className="fg"><label>Tempat Lahir</label><input value={editF.birthPlace||''} placeholder="contoh: Blitar" onChange={e=>setEditF({...editF,birthPlace:e.target.value})}/></div>
          <div className="fg"><label>Tanggal Lahir</label><input type="date" value={editF.birthDate||''} onChange={e=>setEditF({...editF,birthDate:e.target.value})}/></div>
          <div className="fg"><label>Tanggal Wafat</label><input type="date" value={editF.deathDate||''} onChange={e=>setEditF({...editF,deathDate:e.target.value})}/></div>
          <div className="fg"><label>Domisili</label><input value={editF.domicile||''} placeholder="contoh: Malang, Jawa Timur" onChange={e=>setEditF({...editF,domicile:e.target.value})}/></div>
          <div className="fg"><label>Status</label><select value={editF.status||'Hidup'} onChange={e=>setEditF({...editF,status:e.target.value})}><option>Hidup</option><option>Wafat</option><option>Cerai</option></select></div>
          <div className="fg"><label>Catatan</label><textarea value={editF.notes||''} onChange={e=>setEditF({...editF,notes:e.target.value})}/></div>
          <div className="fg"><label>Catatan Orang Tua <span style={{fontWeight:400,color:'#b0a898'}}>(keterangan asuh/kandung)</span></label><textarea value={editF.bioNote||''} onChange={e=>setEditF({...editF,bioNote:e.target.value})}/></div>
          <div className="frow"><button className="btn primary" onClick={saveEdit}>Simpan</button></div>
        </div>
      </>}
    </div>

    {/* MODALS */}
    {modal==='pin'&&<div className="overlay" onClick={()=>{setModal(null);setPinVal('');setPinErr('');}}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>Login Admin</h3><p className="modal-sub">Masukkan PIN untuk mengedit.</p>
        <div className="fg"><input type="password" value={pinVal} autoFocus onChange={e=>setPinVal(e.target.value)} onKeyDown={e=>e.key==='Enter'&&tryPin()}/>{pinErr&&<div style={{color:'red',fontSize:11,marginTop:4}}>{pinErr}</div>}</div>
        <div className="frow"><button className="btn primary" onClick={tryPin}>Masuk</button><button className="btn" onClick={()=>{setModal(null);setPinVal('');setPinErr('');}}>Batal</button></div>
      </div>
    </div>}

    {modal==='delconfirm'&&<div className="overlay">
      <div className="modal">
        <h3>Hapus Anggota?</h3><p className="modal-sub">Hapus <strong>{selP?.fullName}</strong>? Semua relasi terkait juga dihapus dan tidak bisa dibatalkan.</p>
        <div className="frow"><button className="btn danger" onClick={delPerson}>Ya, Hapus</button><button className="btn" onClick={()=>setModal(null)}>Batal</button></div>
      </div>
    </div>}

    {modal==='addrel'&&<div className="overlay" onClick={()=>{setModal(null);setRelSearchQ('');}}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>Tambah Relasi</h3><p className="modal-sub">Untuk: <strong>{selP?.fullName}</strong></p>
        <div className="fg"><label>Jenis Relasi</label><select value={relF.type} onChange={e=>setRelF(f=>({...f,type:e.target.value}))}><option value="married">Pasangan / Menikah</option><option value="parent-of">Orang tua dari (Pilih Anak)</option><option value="child-of">Anak dari (Pilih Ortu)</option></select></div>
        {relF.type!=='married'&&<div className="fg"><label>Status Pengasuh</label><select value={relF.isActive?'1':'0'} onChange={e=>setRelF(f=>({...f,isActive:e.target.value==='1'}))}><option value="1">Aktif (pengasuh saat ini)</option><option value="0">Tidak aktif (biologis / historis)</option></select></div>}
        <div className="fg"><label>Cari Orang</label><input autoFocus placeholder="Ketik nama..." value={relSearchQ} onChange={e=>setRelSearchQ(e.target.value)}/></div>
        <div className="ppicker-list">{people.filter(p=>p.id!==sel && p.fullName.toLowerCase().includes(relSearchQ.toLowerCase())).slice(0,5).map(p=>(
          <div key={p.id} className={`ppicker-item ${relF.pid===p.id?'selected':''}`} onClick={()=>setRelF(f=>({...f,pid:p.id}))}><div className="pi-dot" style={{background:MC(p.gender)}}/>{nn(p)} - <span style={{fontSize:10,color:'#8a8278'}}>{p.displayId}</span></div>
        ))}</div>
        <div className="frow"><button className="btn primary" onClick={prepareAddRel} disabled={!relF.pid}>Konfirmasi</button></div>
      </div>
    </div>}

    {modal==='confirm-parents'&&pendingRel&&(()=>{
      const p1=people.find(x=>x.id===pendingRel.parentIds[0]); const p2=people.find(x=>x.id===pendingRel.parentIds[1]); const ch=people.find(x=>x.id===pendingRel.childId);
      return(
        <div className="overlay">
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3>Konfirmasi Orang Tua</h3>
            <p className="modal-sub">Ditemukan pasangan aktif dari <strong>{p1?nn(p1):''}</strong>:</p>
            <div className="confirm-box" style={{background:'#f8f5f0',border:'1px solid #e8e0d8',padding:'10px 12px',borderRadius:10,fontSize:12,marginBottom:14}}><strong>{p2?nn(p2):''}</strong> terdeteksi sebagai pasangan aktif {p1?nn(p1):''}.<br/>Apakah <strong>{ch?nn(ch):''}</strong> adalah anak dari <strong>keduanya</strong>?</div>
            <div className="frow" style={{flexDirection:'column',gap:6}}><button className="btn primary" onClick={confirmBothParents}>Ya, anak dari {p1?nn(p1):''} &amp; {p2?nn(p2):''}</button><button className="btn" onClick={confirmSingleParent}>Tidak, anak dari {p1?nn(p1):''} saja</button><button className="btn" onClick={()=>{setPendingRel(null);setModal('addrel');}}>Batal</button></div>
          </div>
        </div>
      );
    })()}

    {modal==='addperson'&&<div className="overlay" onClick={()=>setModal(null)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>Tambah Anggota Baru</h3><p className="modal-sub">ID otomatis terbuat saat relasi ditentukan.</p>
        <div className="fg"><label>Nama Lengkap</label><input value={addF.fullName} autoFocus onChange={e=>setAddF({...addF,fullName:e.target.value})}/></div>
        <div className="fg"><label>Panggilan</label><input value={addF.nickname} onChange={e=>setAddF({...addF,nickname:e.target.value})}/></div>
        <div className="fg"><label>Gender</label><select value={addF.gender} onChange={e=>setAddF({...addF,gender:e.target.value})}><option value="M">Laki-laki</option><option value="F">Perempuan</option></select></div>
        <div className="frow"><button className="btn primary" onClick={addPerson} disabled={!addF.fullName}>Tambah</button><button className="btn" onClick={()=>setModal(null)}>Batal</button></div>
      </div>
    </div>}

    {modal==='autolayout'&&<div className="overlay" onClick={()=>setModal(null)}>
      <div className="modal" style={{maxWidth:340}} onClick={e=>e.stopPropagation()}>
        <h3>⊞ Rapikan Otomatis</h3><p className="modal-sub">Algoritma cerdas akan menyusun ulang pohon keluargamu agar tidak tumpang tindih.</p>
        <div className="frow"><button className="btn primary" onClick={()=>computeAutoLayout(focusRoot, true)}>Rapikan Sekarang</button><button className="btn" onClick={()=>setModal(null)}>Batal</button></div>
      </div>
    </div>}

    {modal==='registry'&&<div className="overlay" onClick={()=>{setModal(null);setRegistryFilter(null);}}>
      <div className="modal" style={{maxWidth:460}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}><h3>🪪 ID Registry</h3><button className="btn" onClick={()=>setModal(null)}>✕ Tutup</button></div>
        {(()=>{
          const groups={}; people.forEach(p=>{const b=p.bani||'BARU'; groups[b]=groups[b]||[]; groups[b].push(p);});
          const baniPrefixes=Object.keys(groups).filter(k=>k!=='BARU').sort();
          return <>
            <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:20}}>
              {baniPrefixes.map(prefix=><button key={prefix} onClick={()=>setRegistryFilter(registryFilter===prefix?null:prefix)} className={`btn ${registryFilter===prefix?'primary':''}`}>Bani {prefix} ({groups[prefix].length})</button>)}
              {groups['BARU']&&<button className="btn danger" onClick={()=>setRegistryFilter('BARU')}>Baru/Unlinked ({groups['BARU'].length})</button>}
            </div>
            {(registryFilter||baniPrefixes[0])&&(()=>{
              const activeGrp = registryFilter||baniPrefixes[0];
              const members = groups[activeGrp].sort((a,b)=>{
                if(a.isBlood!==b.isBlood) return a.isBlood?-1:1;
                if(!a.isBlood) return (a.spouseOrder||99)-(b.spouseOrder||99);
                return a.displayId.localeCompare(b.displayId);
              });
              return <table className="reg-table">
                <thead><tr><th>ID Registrasi</th><th>Nama</th><th>Status Darah</th></tr></thead>
                <tbody>{members.map(p=><tr key={p.id}>
                  <td style={{fontWeight:800,fontFamily:'monospace',color:'#4a7a9b'}}>{p.displayId}</td>
                  <td><div style={{fontWeight:700}}>{nn(p)}</div><div style={{fontSize:10,color:'#8a8278'}}>{p.fullName}</div></td>
                  <td>{p.isBlood?<span className="tag-blood">Keturunan Asli</span>:<span className="tag-spouse">Pasangan (Ke-{p.spouseOrder||1})</span>}</td>
                </tr>)}</tbody>
              </table>
            })()}
          </>;
        })()}
      </div>
    </div>}

    {/* ── UI MELAYANG ── */}
    <div className={`legend ${sel?'sb-open':''}`}>
      <div className="li"><svg width="24" height="10"><path d="M2,5 L22,5" stroke="#90a8b8" strokeWidth="2.5" strokeLinecap="round"/></svg> Garis Sedarah</div>
      <div className="li"><svg width="24" height="10"><path d="M2,5 L22,5" stroke="#c8a870" strokeWidth="2.5" strokeDasharray="6 4" strokeLinecap="round"/></svg> Pasangan</div>
      <div className="li"><div className="pi-dot" style={{background:'#6ea8d4'}}/> Laki-laki</div>
      <div className="li"><div className="pi-dot" style={{background:'#d47ea8'}}/> Perempuan</div>
      <div className="li"><div className="pi-dot" style={{background:'#c8a830'}}/> Unknown</div>
    </div>

    <div className={`statpill ${sel?'sb-open':''}`}>
      <div><span className="stat-val">{totalOrang}</span> Individu</div>
      <div className="stat-sep"></div>
      <div><span className="stat-val">{totalPasangan}</span> Pasangan</div>
      <div className="stat-sep"></div>
      <div><span className="stat-val">{totalWafat}</span> Wafat</div>
    </div>

    <div className={`ctrl ${sel?'sb-open':''}`}>
      <button className="cbtn" onClick={()=>setZoom(1.2)}>+</button>
      <button className="cbtn" onClick={()=>setZoom(0.8)}>−</button>
      <button className="cbtn" onClick={()=>autoCamera(focusRoot)} style={{fontSize:22}}>⌂</button>
    </div>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
