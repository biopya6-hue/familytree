const CW=110, CH=96;

const MC=g=>g==='M'?'#6ea8d4':g==='F'?'#d47ea8':'#c8a830';

async function checkPin(val){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(val));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')===PIN_HASH;
}

function fmtDate(d){
  if(!d)return '';
  try{return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});}
  catch{return d;}
}
function fmtBirth(pl,dt){
  const p=pl?.trim(),d=fmtDate(dt);
  if(p&&d)return `${p}, ${d}`;
  return p||d||'';
}
function curve(x1,y1,x2,y2,horiz){
  if(horiz){const dx=x2-x1;return `M${x1},${y1} C${x1+dx*.5},${y1} ${x2-dx*.5},${y2} ${x2},${y2}`;}
  const dy=y2-y1,m=y1+dy*.45;

/* ══════════════════════════════════════════
   ID SYSTEM v2
   - Orang baru → BARU-xxx (sementara)
   - Saat relasi parent-child dikonfirmasi
     → ID otomatis diperbarui ke prefix Bani
   - Pasangan (married) → prefix Bani pasangan + -X
   - KSR-000 / KSR-W1 tetap fixed
══════════════════════════════════════════ */
function makePrefix(name){
  const clean=name.replace(/[^a-zA-Z]/g,'').toUpperCase();
  if(clean.length>=5) return clean[0]+clean[2]+clean[4];
  if(clean.length>=3) return clean[0]+clean[1]+clean[2];
  return clean.padEnd(3,'X');
}

function nextBaniId(prefix, people, isBlood){
  // Only count IDs with this exact prefix (ignore BARU- etc)
  const re=new RegExp(`^${prefix}-(\\d+)(-X)?$`);
  const nums=people
    .map(p=>p.baniId||'')
    .filter(id=>re.test(id))
    .map(id=>parseInt(id.match(re)[1]));
  const next=(nums.length?Math.max(...nums):0)+1;
  const num=String(next).padStart(3,'0');
  return `${prefix}-${num}${isBlood?'':'-X'}`;
}

function nextBaruId(people){
  const re=/^BARU-(\d+)$/;
  const nums=people.map(p=>p.baniId||'').filter(id=>re.test(id)).map(id=>parseInt(id.match(re)[1]));
  const next=(nums.length?Math.max(...nums):0)+1;
  return `BARU-${String(next).padStart(3,'0')}`;
}

/* Given parentIds, find what Bani prefix the child should get */
function getBaniPrefixFromParents(parentIds, allPeople){
  for(const pid of parentIds){
    const p=allPeople.find(x=>x.id===pid);
    if(!p) continue;
    // If parent has a real non-KSR, non-BARU ID → inherit their prefix
    if(p.baniId&&!p.baniId.startsWith('BARU')&&!p.baniId.startsWith('KSR')){
      const m=p.baniId.match(/^([A-Z]+)-/);
      if(m) return m[1];
    }
    // If parent IS Kasirin (KSR-000) or Kasirin's wife (KSR-Wx)
    // → this child becomes a NEW Bani Head — prefix from child's own name
    // We don't know child's name here, so return a special marker
    if(p.baniId&&p.baniId.match(/^KSR-/)){
      return 'NEW_BANI_HEAD'; // caller will use child's name
    }
  }
  return null;
}

function App(){
  const [people,setPeople]   = useState([]);
  const [rels,setRels]       = useState([]);
  const [pos,setPos]         = useState({});
  const [sel,setSel]         = useState(null);
  const [sbMode,setSbMode]   = useState('view');
  const [isAdmin,setIsAdmin] = useState(false);
  const [searchQ,setSearchQ] = useState('');
  const [showSR,setShowSR]   = useState(false);
  const [modal,setModal]     = useState(null); // 'pin'|'addperson'|'addrel'|'delconfirm'|'confirm-parents'|'autolayout'
  const [pinVal,setPinVal]   = useState('');
  const [pinErr,setPinErr]   = useState('');
  const [editF,setEditF]     = useState({});
  const [addF,setAddF]       = useState({fullName:'',nickname:'',gender:'M',status:'Hidup',birthPlace:'',birthDate:'',deathDate:'',domicile:'',photo:'',notes:'',bioNote:''});
  const [relF,setRelF]       = useState({type:'married',pid:'',isActive:true});
  const [relSearchQ,setRelSearchQ]=useState('');
  const [pendingRel,setPendingRel] = useState(null); // {type,pids,isActive} awaiting confirm
  const [vt,setVt]           = useState({x:0,y:0,s:0.55});
  const [edgeSel,setEdgeSel] = useState(null);
  const [showRotHint,setShowRotHint] = useState(false);
  const [showSearch,setShowSearch]   = useState(false);
  const [registryFilter,setRegistryFilter] = useState(null); // null = no bani selected yet
  const dragging=useRef(null), dragOff=useRef({});
  const panning=useRef(false), panStart=useRef({});
  const vpRef=useRef();

  const [loading,setLoading]   = useState(true);
  const [loadErr,setLoadErr]   = useState('');
  const [saveStatus,setSaveStatus] = useState('saved'); // 'syncing'|'saved'|'error'
  const [uploadPct,setUploadPct]   = useState(null); // null | 0-100
  const [uploadTarget,setUploadTarget] = useState(null); // 'edit'|'add'
  const fileInputRef = useRef();
  const saveTimer = useRef(null);
  const isFirstLoad = useRef(true);

  // Delta tracking — store snapshots of last-synced state
  const lastSyncedPeople = useRef({}); // { [id]: personObj }
  const lastSyncedRels   = useRef({}); // { [id]: relObj }
  const lastSyncedPos    = useRef({}); // { [id]: {x,y} }

  /* ══════════════════════════════════════════
     FIREBASE — 3 COLLECTIONS ARCHITECTURE
     members / relationships / positions
  ══════════════════════════════════════════ */
  const COL_MEMBERS       = ()=>db.collection('members');
  const COL_RELATIONSHIPS = ()=>db.collection('relationships');
  const COL_POSITIONS     = ()=>db.collection('positions');

  /* ── LOAD — parallel fetch all 3 collections ── */
  useEffect(()=>{
    async function load(){
      try{
        const [mSnap, rSnap, pSnap] = await Promise.all([
          COL_MEMBERS().get(),
          COL_RELATIONSHIPS().get(),
          COL_POSITIONS().get(),
        ]);

        if(mSnap.empty){
          // First time — seed all 3 collections via batch
          const batch=db.batch();
          SP.forEach(p=>batch.set(COL_MEMBERS().doc(p.id), p));
          SR.forEach(r=>batch.set(COL_RELATIONSHIPS().doc(r.id), r));
          Object.entries(SPOS).forEach(([id,xy])=>batch.set(COL_POSITIONS().doc(id), xy));
          await batch.commit();
          setPeople(SP);setRels(SR);setPos({...SPOS});
          SP.forEach(p=>{lastSyncedPeople.current[p.id]=p;});
          SR.forEach(r=>{lastSyncedRels.current[r.id]=r;});
          Object.entries(SPOS).forEach(([id,xy])=>{lastSyncedPos.current[id]=xy;});
          localStorage.setItem('silsilah_v10',JSON.stringify({people:SP,rels:SR,pos:SPOS}));
        } else {
          const loadedPeople=mSnap.docs.map(d=>d.data());
          const loadedRels=rSnap.docs.map(d=>d.data());
          const loadedPos={};
          pSnap.docs.forEach(d=>{loadedPos[d.id]=d.data();});
          setPeople(loadedPeople);
          setRels(loadedRels);
          setPos(loadedPos);
          loadedPeople.forEach(p=>{lastSyncedPeople.current[p.id]=p;});
          loadedRels.forEach(r=>{lastSyncedRels.current[r.id]=r;});
          Object.entries(loadedPos).forEach(([id,xy])=>{lastSyncedPos.current[id]=xy;});
          // 🟠 FIX: simpan data yang baru di-load, bukan SP lama
          localStorage.setItem('silsilah_v10',JSON.stringify({people:loadedPeople,rels:loadedRels,pos:loadedPos}));
        }
      }catch(err){
        console.error('Firebase load error:',err);
        try{
          const saved=JSON.parse(localStorage.getItem('silsilah_v10')||'null');
          if(saved){
            // Merge saved people with SP: tambahkan anggota baru dari SP yang belum ada di saved
            const savedIds=new Set((saved.people||[]).map(p=>p.id));
            const mergedPeople=[...(saved.people||[]),...SP.filter(p=>!savedIds.has(p.id))];
            // Merge saved rels dengan SR: tambahkan relasi baru dari SR yang belum ada di saved
            const savedRelIds=new Set((saved.rels||[]).map(r=>r.id));
            const mergedRels=[...(saved.rels||[]),...SR.filter(r=>!savedRelIds.has(r.id))];
            // Merge posisi: mulai dari SPOS (default), lalu timpa dengan saved.pos
            // TAPI: abaikan posisi saved yang masih di (0,0) — itu berarti belum pernah diposisikan
            const mergedPos={...SPOS};
            Object.entries(saved.pos||{}).forEach(([id,xy])=>{
              // Hanya pakai posisi saved jika bukan {0,0} (posisi valid = sudah pernah digeser)
              if(xy&&(xy.x!==0||xy.y!==0)) mergedPos[id]=xy;
            });
            setPeople(mergedPeople);setRels(mergedRels);setPos(mergedPos);
          }
          else{setPeople(SP);setRels(SR);setPos({...SPOS});}
          setLoadErr('Offline — perubahan hanya tersimpan di perangkat ini.');
        }catch{setPeople(SP);setRels(SR);setPos({...SPOS});}
      } finally{setLoading(false);}
    }
    load();
  },[]);

  /* ── DELTA SAVE — debounced 1.5s, only write changed docs ── */
  useEffect(()=>{
    if(!people.length)return;
    // Always keep localStorage as backup
    localStorage.setItem('silsilah_v10',JSON.stringify({people,rels,pos}));
    if(isFirstLoad.current){isFirstLoad.current=false;return;}

    setSaveStatus('syncing');
    if(saveTimer.current)clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(async()=>{
      try{
        const batch=db.batch();
        let changes=0;

        // ── members delta ──
        const currentPeopleMap={};
        people.forEach(p=>{currentPeopleMap[p.id]=p;});
        // Write new/changed members
        people.forEach(p=>{
          const prev=lastSyncedPeople.current[p.id];
          if(!prev||JSON.stringify(prev)!==JSON.stringify(p)){
            batch.set(COL_MEMBERS().doc(p.id), p);
            changes++;
          }
        });
        // Delete removed members
        Object.keys(lastSyncedPeople.current).forEach(id=>{
          if(!currentPeopleMap[id]){
            batch.delete(COL_MEMBERS().doc(id));
            changes++;
          }
        });

        // ── relationships delta ──
        const currentRelsMap={};
        rels.forEach(r=>{currentRelsMap[r.id]=r;});
        rels.forEach(r=>{
          const prev=lastSyncedRels.current[r.id];
          if(!prev||JSON.stringify(prev)!==JSON.stringify(r)){
            batch.set(COL_RELATIONSHIPS().doc(r.id), r);
            changes++;
          }
        });
        Object.keys(lastSyncedRels.current).forEach(id=>{
          if(!currentRelsMap[id]){
            batch.delete(COL_RELATIONSHIPS().doc(id));
            changes++;
          }
        });

        // ── positions delta ──
        Object.entries(pos).forEach(([id,xy])=>{
          const prev=lastSyncedPos.current[id];
          if(!prev||prev.x!==xy.x||prev.y!==xy.y){
            batch.set(COL_POSITIONS().doc(id), xy);
            changes++;
          }
        });
        Object.keys(lastSyncedPos.current).forEach(id=>{
          if(!pos[id]){
            batch.delete(COL_POSITIONS().doc(id));
            changes++;
          }
        });

        if(changes>0){
          await batch.commit();
          console.log(`Firebase: ${changes} doc(s) synced`);
        }

        // Update snapshots after successful save
        people.forEach(p=>{lastSyncedPeople.current[p.id]=p;});
        Object.keys(lastSyncedPeople.current).forEach(id=>{if(!currentPeopleMap[id])delete lastSyncedPeople.current[id];});
        rels.forEach(r=>{lastSyncedRels.current[r.id]=r;});
        Object.keys(lastSyncedRels.current).forEach(id=>{if(!currentRelsMap[id])delete lastSyncedRels.current[id];});
        Object.entries(pos).forEach(([id,xy])=>{lastSyncedPos.current[id]=xy;});
        Object.keys(lastSyncedPos.current).forEach(id=>{if(!pos[id])delete lastSyncedPos.current[id];});

        setSaveStatus('saved');
      }catch(err){
        console.error('Firebase save error:',err);
        setSaveStatus('error');
      }
    },1500);
  },[people,rels,pos]);

  /* ── PHOTO UPLOAD to Firebase Storage ── */
  async function uploadPhoto(file, personId){
    if(!file)return null;
    setUploadPct(0);
    try{
      const ext=file.name.split('.').pop().toLowerCase();
      const ref=storage.ref(`photos/${personId}_${Date.now()}.${ext}`);
      const task=ref.put(file);
      await new Promise((res,rej)=>{
        task.on('state_changed',
          snap=>setUploadPct(Math.round(snap.bytesTransferred/snap.totalBytes*100)),
          rej, res
        );
      });
      const url=await ref.getDownloadURL();
      setUploadPct(null);
      return url;
    }catch(err){
      console.error('Upload error:',err);
      setUploadPct(null);
      return null;
    }
  }
  useEffect(()=>{
    if(!people.length||!vpRef.current)return;
    const vw=vpRef.current.clientWidth,vh=vpRef.current.clientHeight;
    // Center on Kasirin (KSR-000) secara dinamis, bukan hardcoded ke Panidjan
    const root=people.find(p=>p.baniId==='KSR-000');
    const rp=root&&pos[root.id];
    const cx=rp?rp.x+CW/2:1010+CW/2;
    const cy=rp?rp.y+CH/2:-180+CH/2;
    setVt({s:0.45,x:vw/2-cx*0.45,y:vh/2-cy*0.45+40});
  },[people.length]);

  const selP=people.find(p=>p.id===sel)||null;

  /* ── ALL VISIBLE (3-gen-focus removed) ── */
  const visibleIds = useMemo(()=>new Set(people.map(p=>p.id)),[people]);

  /* ── RELATION HELPERS ── */
  function getActiveParents(pid){
    const rs=rels.filter(r=>r.type==='parent-child'&&r.isActive&&r.pids[r.pids.length-1]===pid);
    return [...new Set(rs.flatMap(r=>r.pids.slice(0,-1)))];
  }
  function getBioParents(pid){
    const rs=rels.filter(r=>r.type==='parent-child'&&!r.isActive&&r.pids[r.pids.length-1]===pid);
    return [...new Set(rs.flatMap(r=>r.pids.slice(0,-1)))];
  }
  function isAdopted(pid){
    return rels.some(r=>r.type==='parent-child'&&!r.isActive&&r.pids[r.pids.length-1]===pid)&&
           rels.some(r=>r.type==='parent-child'&&r.isActive&&r.pids[r.pids.length-1]===pid);
  }
  function getBioChildren(pid){
    return rels.filter(r=>r.type==='parent-child'&&r.pids.slice(0,-1).includes(pid)).map(r=>r.pids[r.pids.length-1]);
  }
  function getActiveChildren(pid){
    return rels.filter(r=>r.type==='parent-child'&&r.isActive&&r.pids.slice(0,-1).includes(pid)).map(r=>r.pids[r.pids.length-1]);
  }
  function getPartners(pid){
    return rels.filter(r=>r.type==='married'&&r.pids.includes(pid)).flatMap(r=>r.pids.filter(x=>x!==pid));
  }
  function getActivePartner(pid){
    // find the "other" active partner in a marriage (for auto-detect)
    const marriages=rels.filter(r=>r.type==='married'&&r.pids.includes(pid));
    // prefer non-cerai partner
    for(const m of marriages){
      const other=m.pids.find(x=>x!==pid);
      const op=people.find(p=>p.id===other);
      if(op&&op.status!=='Cerai') return other;
    }
    return marriages[0]?.pids.find(x=>x!==pid)||null;
  }
  function getSiblings(pid){
    const sibs=new Set();
    // Gabungkan semua orang tua (aktif + biologis) untuk mendapatkan semua saudara kandung/tiri
    const myParents=new Set([...getActiveParents(pid),...getBioParents(pid)]);
    rels.forEach(r=>{
      if(r.type==='parent-child'){
        const parents=r.pids.slice(0,-1),child=r.pids[r.pids.length-1];
        if(child===pid)return;
        if(parents.some(p=>myParents.has(p)))sibs.add(child);
      }
    });
    return [...sibs];
  }
  function getChildrenForDisplay(pid){
    // Anak dari relasi TIDAK aktif (biologis/historis, anak diserahkan ke keluarga lain)
    const inactiveOnly=[...new Set(
      rels.filter(r=>r.type==='parent-child'&&!r.isActive&&r.pids.slice(0,-1).includes(pid))
          .map(r=>r.pids[r.pids.length-1])
    )];
    // Anak dari relasi AKTIF (pengasuh saat ini)
    const act=[...new Set(getActiveChildren(pid))];
    // Gabungan semua anak yang perlu ditampilkan
    const shown=new Set([...inactiveOnly,...act]);
    return [...shown].map(cid=>({
      id:cid,
      // 'biologis': anak hanya di relasi tidak-aktif = orang tua biologis yang sudah tidak mengasuh
      // 'asuh': anak di relasi aktif, tapi anak tersebut punya orang tua biologis lain (diadopsi)
      // undefined: relasi normal (aktif sekaligus biologis, atau tidak ada kasus khusus)
      tag:inactiveOnly.includes(cid)&&!act.includes(cid)?'biologis':
          !inactiveOnly.includes(cid)&&act.includes(cid)&&isAdopted(cid)?'asuh':
          undefined
    }));
  }

  /* ── CONNECTORS ── */
  function buildLines(){
    const lines=[],drawn=new Set();
    rels.forEach(r=>{
      if(r.type==='married'){
        const[a,b]=r.pids;
        const pa=pos[a],pb=pos[b];if(!pa||!pb)return;
        if(!visibleIds.has(a)||!visibleIds.has(b))return;
        const key=[a,b].sort().join('-');
        if(drawn.has(key))return;drawn.add(key);
        const x1=CX(pa),y1=CY(pa),x2=CX(pb),y2=CY(pb);
        lines.push({rid:r.id,d:curve(x1,y1,x2,y2,true),stroke:'#c8a870',dash:'7 4',w:2.5,mx:(x1+x2)/2,my:(y1+y2)/2,label:'Pasangan',type:'married',active:true});
      }
      if(r.type==='parent-child'&&r.isActive){
        const pids=r.pids.slice(0,-1),cid=r.pids[r.pids.length-1];
        const pc=pos[cid];if(!pc)return;
        if(!visibleIds.has(cid))return;
        const valid=pids.filter(x=>pos[x]&&visibleIds.has(x));if(!valid.length)return;
        const sx=valid.reduce((s,x)=>s+CX(pos[x]),0)/valid.length;
        const sy=valid.reduce((s,x)=>s+CY(pos[x]),0)/valid.length;
        lines.push({rid:r.id,d:curve(sx,sy,CX(pc),CY(pc),false),stroke:'#90a8b8',dash:undefined,w:2.5,mx:(sx+CX(pc))/2,my:(sy+CY(pc))/2,label:'Orang tua → Anak',type:'parent-child',active:r.isActive});
      }
    });
    return lines;
  }

  /* ── PAN / ZOOM ── */
  const vpTop = 50; // topbar height
  function vpDown(e){if(e.target!==vpRef.current)return;panning.current=true;panStart.current={x:e.clientX-vt.x,y:e.clientY-vt.y};}
  function vpMove(e){
    if(dragging.current){
      e.preventDefault();
      setPos(p=>({...p,[dragging.current]:{x:e.clientX/vt.s-dragOff.current.x,y:(e.clientY-vpTop)/vt.s-dragOff.current.y}}));
      return;
    }
    if(!panning.current)return;
    setVt(t=>({...t,x:e.clientX-panStart.current.x,y:e.clientY-panStart.current.y}));
  }
  function vpUp(){panning.current=false;dragging.current=null;}

  /* ── WHEEL ZOOM (fix: use ref to avoid stale closure) ── */
  const vtRef=useRef(vt);
  useEffect(()=>{vtRef.current=vt;},[vt]);
  useEffect(()=>{
    const el=vpRef.current;if(!el)return;
    function onWheel(e){
      e.preventDefault();
      const t=vtRef.current;
      const f=e.deltaY<0?1.12:0.9;
      const ns=Math.min(Math.max(t.s*f,0.15),4);
      const rect=el.getBoundingClientRect();
      const mx=e.clientX-rect.left,my=e.clientY-rect.top;
      setVt({s:ns,x:mx-(mx-t.x)*(ns/t.s),y:my-(my-t.y)*(ns/t.s)});
    }
    el.addEventListener('wheel',onWheel,{passive:false});
    return()=>el.removeEventListener('wheel',onWheel);
  },[]);

  /* ── TOUCH PAN / PINCH-ZOOM ── */
  const lastTouch=useRef(null);   // {x,y} origin for pan (offset from vt)
  const lastPinch=useRef(null);   // pinch anchor snapshot
  const touchStartPos=useRef(null); // raw start clientX/Y for tap detection
  const TAP_SLOP=8; // px — movement within this = tap, not drag

  function onTouchStart(e){
    // Never intercept interactive UI elements or overlay panels
    const tag=e.target.tagName;
    if(tag==='BUTTON'||tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||tag==='A')return;
    if(e.target.closest('.sidebar,.modal,.overlay,.ctrl,.legend,.statpill,.topbar,.sresults,.edge-popup'))return;

    if(e.touches.length===1){
      const t=e.touches[0];
      touchStartPos.current={x:t.clientX,y:t.clientY};
      lastTouch.current={x:t.clientX-vtRef.current.x,y:t.clientY-vtRef.current.y};
      lastPinch.current=null;
      // Don't preventDefault yet — let potential tap/click events fire normally
    } else if(e.touches.length>=2){
      e.preventDefault(); // pinch always captured
      const t0=e.touches[0],t1=e.touches[1];
      const dx=t0.clientX-t1.clientX, dy=t0.clientY-t1.clientY;
      lastPinch.current={
        dist:Math.hypot(dx,dy),
        s:vtRef.current.s,
        x:vtRef.current.x,
        y:vtRef.current.y,
        mx:(t0.clientX+t1.clientX)/2,
        my:(t0.clientY+t1.clientY)/2,
      };
      lastTouch.current=null;
      touchStartPos.current=null;
    }
  }
  function onTouchMove(e){
    if(e.touches.length===1&&lastTouch.current){
      const t=e.touches[0];
      const sp=touchStartPos.current;
      const moved=sp?Math.hypot(t.clientX-sp.x,t.clientY-sp.y):TAP_SLOP+1;
      if(moved<TAP_SLOP)return; // still within tap slop — don't pan yet
      e.preventDefault(); // only preventDefault once we're actually panning
      const nx=t.clientX-lastTouch.current.x;
      const ny=t.clientY-lastTouch.current.y;
      if(isFinite(nx)&&isFinite(ny)) setVt(prev=>({...prev,x:nx,y:ny}));
    } else if(e.touches.length>=2&&lastPinch.current){
      e.preventDefault();
      const t0=e.touches[0],t1=e.touches[1];
      const dx=t0.clientX-t1.clientX, dy=t0.clientY-t1.clientY;
      const dist=Math.hypot(dx,dy);
      if(!dist)return;
      const ratio=dist/lastPinch.current.dist;
      const ns=Math.min(Math.max(lastPinch.current.s*ratio,0.15),4);
      const {mx,my,x:ox,y:oy,s:os}=lastPinch.current;
      const nx=mx-(mx-ox)*(ns/os);
      const ny=my-(my-oy)*(ns/os);
      if(isFinite(ns)&&isFinite(nx)&&isFinite(ny)) setVt({s:ns,x:nx,y:ny});
    }
  }
  function onTouchEnd(e){
    if(e.touches.length===0){
      lastTouch.current=null;lastPinch.current=null;touchStartPos.current=null;
    } else if(e.touches.length===1){
      const t=e.touches[0];
      lastTouch.current={x:t.clientX-vtRef.current.x,y:t.clientY-vtRef.current.y};
      lastPinch.current=null;
      touchStartPos.current={x:t.clientX,y:t.clientY};
    }
  }
  useEffect(()=>{
    const el=vpRef.current;if(!el)return;
    // touchstart passive:true so we don't block scroll/tap until we decide it's a drag
    el.addEventListener('touchstart',onTouchStart,{passive:true});
    el.addEventListener('touchmove',onTouchMove,{passive:false});
    el.addEventListener('touchend',onTouchEnd,{passive:true});
    return()=>{
      el.removeEventListener('touchstart',onTouchStart);
      el.removeEventListener('touchmove',onTouchMove);
      el.removeEventListener('touchend',onTouchEnd);
    };
  },[]);

  function nodeDown(e,id){if(!isAdmin)return;e.stopPropagation();dragging.current=id;const p=pos[id]||{x:0,y:0};dragOff.current={x:e.clientX/vt.s-p.x,y:(e.clientY-vpTop)/vt.s-p.y};}

  /* ── EDGE CLICK ── */
  function onEdgeClick(e,line){
    if(!isAdmin)return;e.stopPropagation();
    const sx=line.mx*vt.s+vt.x, sy=line.my*vt.s+vt.y+vpTop;
    setEdgeSel({rid:line.rid,sx,sy,label:line.label,type:line.type,active:line.active});
  }
  function toggleEdgeActive(){setRels(prev=>prev.map(r=>r.id===edgeSel.rid?{...r,isActive:!r.isActive}:r));setEdgeSel(null);}
  function deleteEdge(){setRels(prev=>prev.filter(r=>r.id!==edgeSel.rid));setEdgeSel(null);}

  /* ── CRUD ── */
  async function tryPin(){const ok=await checkPin(pinVal);if(ok){setIsAdmin(true);setModal(null);setPinVal('');setPinErr('');}else setPinErr('PIN salah.');}
  async function saveEdit(){
    setPeople(prev=>prev.map(p=>p.id===editF.id?{...editF}:p));
    setSbMode('view');
  }
  async function handlePhotoUpload(e, target){
    const file=e.target.files?.[0];
    if(!file)return;
    setUploadTarget(target);
    const personId = target==='edit'?(editF.id||'new'):'new_'+Date.now();
    const url=await uploadPhoto(file, personId);
    if(url){
      if(target==='edit') setEditF(f=>({...f,photo:url}));
      else setAddF(f=>({...f,photo:url}));
    }
    setUploadTarget(null);
    // reset input
    if(fileInputRef.current) fileInputRef.current.value='';
  }
  function delPerson(){
    setPeople(prev=>prev.filter(p=>p.id!==sel));
    setRels(prev=>prev.filter(r=>!r.pids.includes(sel)));
    setPos(prev=>{const n={...prev};delete n[sel];return n;});
    setSel(null);setSbMode('view');setModal(null);
  }
  function addPerson(){
    const internalId='p'+Date.now();
    const xs=Object.values(pos).map(p=>p.x);
    const maxX=xs.length?Math.max(...xs):200;
    // Assign temporary BARU ID — will be resolved when parent-child relation is set
    const baniId=nextBaruId([...people, {baniId:'BARU-000'}]); // include dummy to start from 001
    const newPerson={id:internalId,...addF,baniId};
    setPeople(prev=>[...prev,newPerson]);
    setPos(prev=>({...prev,[internalId]:{x:maxX+160,y:320}}));
    setSel(internalId);setSbMode('view');setModal(null);
    setAddF({fullName:'',nickname:'',gender:'M',status:'Hidup',birthPlace:'',birthDate:'',deathDate:'',domicile:'',photo:'',notes:'',bioNote:''});
  }

  /* ── ADD RELATION with auto-detect partner ── */
  function prepareAddRel(){
    if(!relF.pid||!sel)return;
    const isActive=!!relF.isActive;
    if(relF.type==='married'){
      commitMarriage(sel, relF.pid);
      setRelF({type:'married',pid:'',isActive:true});setModal(null);return;
    }
    // parent-child: determine parent(s)
    let parentIds=[], childId='';
    if(relF.type==='child-of'){
      // sel is child, relF.pid is one parent
      parentIds=[relF.pid]; childId=sel;
    } else {
      // sel is parent, relF.pid is child
      parentIds=[sel]; childId=relF.pid;
    }
    // auto-detect partner of the parent(s)
    const mainParent=parentIds[0];
    const partner=getActivePartner(mainParent);
    if(partner&&partner!==childId){
      // ask for confirmation
      setPendingRel({parentIds:[mainParent,partner],childId,isActive});
      setModal('confirm-parents');
    } else {
      // single parent only
      commitRel([mainParent],childId,isActive);
      setRelF({type:'married',pid:'',isActive:true});setModal(null);
    }
  }
  function commitRel(parentIds, childId, isActive){
    setRels(prev=>[...prev,{id:'r'+Date.now(),type:'parent-child',pids:[...parentIds,childId],isActive}]);
    // Auto-resolve baniId for child if still BARU or missing
    setPeople(prev=>{
      const child=prev.find(p=>p.id===childId);
      if(!child) return prev;
      const alreadyReal=child.baniId&&!child.baniId.startsWith('BARU');
      if(alreadyReal) return prev;

      // Get prefix signal from parents
      let prefixSignal=getBaniPrefixFromParents(parentIds, prev);
      let finalPrefix;

      if(prefixSignal==='NEW_BANI_HEAD'){
        // Child of Kasirin → becomes a new Bani Head, use their own name as prefix
        finalPrefix=makePrefix(child.nickname||child.fullName);
      } else if(prefixSignal){
        finalPrefix=prefixSignal;
      } else {
        return prev; // can't determine, leave as BARU
      }

      // Determine blood status: child of KSR or of a blood parent = blood descendant
      const isBlood=parentIds.some(pid=>{
        const p=prev.find(x=>x.id===pid);
        return p&&p.baniId&&(p.baniId.match(/^KSR-/)||!p.baniId.endsWith('-X'));
      });
      const newId=nextBaniId(finalPrefix, prev, isBlood);
      return prev.map(p=>p.id===childId?{...p,baniId:newId}:p);
    });
  }

  /* Auto-assign -X ID to new spouse when married relation is committed */
  function commitMarriage(pid1, pid2){
    setRels(prev=>[...prev,{id:'r'+Date.now(),type:'married',pids:[pid1,pid2],isActive:true}]);
    setPeople(prev=>{
      // Find which one has BARU or missing ID → they are the newcomer
      const p1=prev.find(p=>p.id===pid1);
      const p2=prev.find(p=>p.id===pid2);
      if(!p1||!p2) return prev;
      const newcomer=p1.baniId?.startsWith('BARU')?p1:p2.baniId?.startsWith('BARU')?p2:null;
      const existing=newcomer?.id===pid1?p2:p1;
      if(!newcomer||!existing) return prev;
      // Get prefix from existing spouse
      if(!existing.baniId||existing.baniId.startsWith('BARU')) return prev;
      const m=existing.baniId.match(/^([A-Z]+)-/);
      if(!m) return prev;
      const prefix=m[1];
      const newId=nextBaniId(prefix, prev, false); // married in = -X
      return prev.map(p=>p.id===newcomer.id?{...p,baniId:newId}:p);
    });
  }
  function confirmBothParents(){
    commitRel(pendingRel.parentIds,pendingRel.childId,pendingRel.isActive);
    setPendingRel(null);setRelF({type:'married',pid:'',isActive:true});setModal(null);
  }
  function confirmSingleParent(){
    commitRel([pendingRel.parentIds[0]],pendingRel.childId,pendingRel.isActive);
    setPendingRel(null);setRelF({type:'married',pid:'',isActive:true});setModal(null);
  }

  function removeRel(rid){setRels(prev=>prev.filter(r=>r.id!==rid));}

  /* ── FOCUS / RESET ── */
  function centerPerson(id){

    if(p&&vpRef.current){
      const vw=vpRef.current.clientWidth,vh=vpRef.current.clientHeight;
      const ns=vt.s;
      setVt({s:ns,x:vw/2-CX(p)*ns,y:vh/2-CY(p)*ns});
    }
  }
  function fullReset(){
    if(!vpRef.current)return;
    const vw=vpRef.current.clientWidth,vh=vpRef.current.clientHeight;
    // 🟡 FIX: cari posisi root (KSR-000) secara dinamis, tidak hardcoded
    const root=people.find(p=>p.baniId==='KSR-000');
    const rootPos=root&&pos[root.id];
    const cx=rootPos?rootPos.x+CW/2:1080+CW/2;
    const cy=rootPos?rootPos.y+CH/2:80+CH/2;
    setVt({s:0.55,x:vw/2-cx*0.55,y:vh/2-cy*0.55+60});

  /* ══════════════════════════════════════════════════════
     AUTO LAYOUT — Subtree-Width Per Bani (Bottom-Up)
     
     Algoritma:
     1. Hitung generasi tiap orang (BFS dari Kasirin)
     2. Untuk tiap Bani Head (anak langsung Kasirin):
        - Rekursif hitung lebar subtree-nya dari bawah ke atas
        - Posisikan anak-anak dulu, lalu orang tua di tengah mereka
        - Pasangan diletakkan di samping (kanan dari darah)
     3. Susun semua Bani secara horizontal kiri→kanan dengan padding
     4. Kasirin + Istri diposisikan di tengah total lebar
  ══════════════════════════════════════════════════════ */
  function computeAutoLayout(){
    const CARD_W=110, GAP_X=40, GAP_Y=160, PAD_BANI=80;
    const START_Y=0;

    // ── 1. Hitung generasi (BFS dari KSR-000) ──
    const genMap={};
    const root=people.find(p=>p.baniId==='KSR-000');
    if(!root){setModal(null);return;}
    const queue=[root.id];
    genMap[root.id]=0;
    while(queue.length){
      const cur=queue.shift();
      const g=genMap[cur];
      rels.filter(r=>r.type==='married'&&r.pids.includes(cur)).forEach(r=>{
        r.pids.forEach(pid=>{if(!(pid in genMap)){genMap[pid]=g;queue.push(pid);}});
      });
      rels.filter(r=>r.type==='parent-child'&&r.isActive&&r.pids.slice(0,-1).includes(cur)).forEach(r=>{
        const cid=r.pids[r.pids.length-1];
        if(!(cid in genMap)){genMap[cid]=g+1;queue.push(cid);}
      });
    }
    people.forEach(p=>{if(!(p.id in genMap))genMap[p.id]=99;});

    // ── 2. Helper: dapatkan anak aktif dari satu orang ──
    function getBloodChildren(pid){
      const childIds=new Set();
      rels.filter(r=>r.type==='parent-child'&&r.isActive&&r.pids.slice(0,-1).includes(pid))
        .forEach(r=>childIds.add(r.pids[r.pids.length-1]));
      return [...childIds];
    }

    // 🔴 FIX: return SEMUA pasangan, bukan hanya yang pertama
    function getSpousesOf(pid){
      const spouses=[];
      rels.filter(r=>r.type==='married'&&r.pids.includes(pid)).forEach(r=>{
        const other=r.pids.find(x=>x!==pid);
        if(other&&!spouses.includes(other)) spouses.push(other);
      });
      return spouses;
    }

    // 🔴 FIX: subtreeWidth memperhitungkan SEMUA pasangan dalam unit lebar
    function subtreeWidth(pid, visited=new Set()){
      if(visited.has(pid)) return CARD_W;
      visited.add(pid);
      const spouses=getSpousesOf(pid);
      // Unit lebar = kartu darah + semua pasangan + gap antar mereka
      const selfWidth=spouses.length>0
        ? CARD_W*(1+spouses.length)+GAP_X*spouses.length
        : CARD_W;
      const children=getBloodChildren(pid);
      if(!children.length) return selfWidth;
      const childTotal=children.reduce((sum,cid)=>sum+subtreeWidth(cid,new Set([...visited])),0)
                       +(children.length-1)*GAP_X;
      return Math.max(selfWidth, childTotal);
    }

    // ── 4. Recursive posisi dalam satu Bani ──
    function layoutSubtree(pid, centerX, gen, newPos, visited=new Set()){
      if(visited.has(pid)) return;
      visited.add(pid);
      const yPos=START_Y+gen*GAP_Y;
      const spouses=getSpousesOf(pid);
      const children=getBloodChildren(pid);

      // Posisi unit orang darah + pasangan
      // Pola: [pasangan sebelum] — [darah] — [pasangan setelah]
      // Untuk poligami: urutan berdasarkan urutan relasi menikah
      // Pasangan pertama di kiri darah, pasangan kedua di kanan darah
      function placeUnit(selfCX){
        if(spouses.length===0){
          newPos[pid]={x:Math.round(selfCX-CARD_W/2), y:Math.round(yPos)};
        } else if(spouses.length===1){
          // Darah di kiri, pasangan di kanan — jarak seragam GAP_X
          newPos[pid]={x:Math.round(selfCX-CARD_W-GAP_X/2), y:Math.round(yPos)};
          if(!newPos[spouses[0]]) newPos[spouses[0]]={x:Math.round(selfCX+GAP_X/2), y:Math.round(yPos)};
        } else {
          // Poligami: Istri1 — Darah — Istri2 ... dst
          // Semua jarak antar kartu = GAP_X (seragam)
          const totalUnit=CARD_W*(1+spouses.length)+GAP_X*spouses.length;
          let ux=selfCX-totalUnit/2;
          const before=spouses.slice(0,Math.floor(spouses.length/2));
          const after=spouses.slice(Math.floor(spouses.length/2));
          before.forEach(sp=>{
            if(!newPos[sp]) newPos[sp]={x:Math.round(ux), y:Math.round(yPos)};
            ux+=CARD_W+GAP_X;
          });
          newPos[pid]={x:Math.round(ux), y:Math.round(yPos)};
          ux+=CARD_W+GAP_X;
          after.forEach(sp=>{
            if(!newPos[sp]) newPos[sp]={x:Math.round(ux), y:Math.round(yPos)};
            ux+=CARD_W+GAP_X;
          });
        }
      }

      if(children.length===0){
        placeUnit(centerX);
        return;
      }

      // Posisikan anak-anak lebih dulu
      const widths=children.map(cid=>subtreeWidth(cid,new Set([pid])));
      const totalChildW=widths.reduce((s,w)=>s+w,0)+(children.length-1)*GAP_X;
      let cx=centerX-totalChildW/2;
      children.forEach((cid,i)=>{
        const w=widths[i];
        layoutSubtree(cid, cx+w/2, gen+1, newPos, new Set([...visited]));
        cx+=w+GAP_X;
      });

      // Orang tua di tengah span anak paling kiri & kanan
      const lcx=newPos[children[0]]?newPos[children[0]].x+CARD_W/2:centerX;
      const rcx=newPos[children[children.length-1]]?newPos[children[children.length-1]].x+CARD_W/2:centerX;
      const selfCX=(lcx+rcx)/2;
      placeUnit(selfCX);
    }

    // ── 5. Susun Bani kiri→kanan ──
    const newPos={};
    // Bani Heads = anak langsung Kasirin (gen=1)
    const baniHeads=people.filter(p=>genMap[p.id]===1&&
      rels.some(r=>r.type==='parent-child'&&r.isActive&&
        r.pids.slice(0,-1).includes(root.id)&&r.pids[r.pids.length-1]===p.id)
    );

    // Urutkan berdasarkan ID relasi (urutan input) — hormati urutan kelahiran
    baniHeads.sort((a,b)=>{
      const ra=rels.find(r=>r.type==='parent-child'&&r.isActive&&r.pids[r.pids.length-1]===a.id);
      const rb=rels.find(r=>r.type==='parent-child'&&r.isActive&&r.pids[r.pids.length-1]===b.id);
      return (ra?.id||'').localeCompare(rb?.id||'');
    });

    let cursorX=0;
    baniHeads.forEach((bh,i)=>{
      const w=subtreeWidth(bh.id, new Set([root.id]));
      const centerX=cursorX+w/2;
      layoutSubtree(bh.id, centerX, 1, newPos, new Set([root.id]));
      cursorX+=w+(i<baniHeads.length-1?PAD_BANI:0);
    });

    const totalW=cursorX;

    // ── 6. Posisikan Kasirin di tengah total — pola poligami Istri1—Kasirin—Paenem ──
    const rootCX=totalW/2;
    const rootSpouses=getSpousesOf(root.id); // semua istri Kasirin, urut relasi
    if(rootSpouses.length===0){
      newPos[root.id]={x:Math.round(rootCX-CARD_W/2), y:Math.round(START_Y)};
    } else if(rootSpouses.length===1){
      // Satu istri: Kasirin kiri, Istri kanan
      newPos[root.id]={x:Math.round(rootCX-CARD_W-GAP_X/2), y:Math.round(START_Y)};
      newPos[rootSpouses[0]]={x:Math.round(rootCX+GAP_X/2), y:Math.round(START_Y)};
    } else {
      // Poligami Kasirin: Istri1 — Kasirin — Paenem (sama persis pola placeUnit)
      const totalUnit=CARD_W*(1+rootSpouses.length)+GAP_X*rootSpouses.length;
      let ux=rootCX-totalUnit/2;
      const before=rootSpouses.slice(0,Math.floor(rootSpouses.length/2));
      const after=rootSpouses.slice(Math.floor(rootSpouses.length/2));
      before.forEach(sp=>{
        newPos[sp]={x:Math.round(ux), y:Math.round(START_Y)};
        ux+=CARD_W+GAP_X;
      });
      newPos[root.id]={x:Math.round(ux), y:Math.round(START_Y)};
      ux+=CARD_W+GAP_X;
      after.forEach(sp=>{
        newPos[sp]={x:Math.round(ux), y:Math.round(START_Y)};
        ux+=CARD_W+GAP_X;
      });
    }

    // ── 7. Orang yang tidak terhubung → baris bawah sendiri ──
    const unconnected=people.filter(p=>!(p.id in newPos));
    let ux2=0;
    const maxY=Math.max(...Object.values(newPos).map(p=>p.y),0);
    unconnected.forEach(p=>{
      newPos[p.id]={x:Math.round(ux2), y:Math.round(maxY+GAP_Y+120)};
      ux2+=CARD_W+GAP_X;
    });

    setPos(newPos);
    if(vpRef.current){
      const vw=vpRef.current.clientWidth,vh=vpRef.current.clientHeight;
      setVt({s:0.5,x:vw/2-rootCX*0.5,y:vh/2-START_Y*0.5+80});
    }
    setModal(null);
  }

  /* ── BANI LABEL ──
     Rules:
     1. No selection → "Bani Kasirin"
     2. Person IS Kasirin or their spouse (KSR ID) → "Bani Kasirin"
     3. Person is a direct child of Kasirin → "Bani [their nickname]"
     4. Everyone else → find their Bani Head by walking up active parents,
        stopping at the direct child of Kasirin.
        If no parent chain found (married-in with no parents set) →
        try partner's Bani Head.
  ── */
  function getBaniHead(pid, visited=new Set()){
    if(visited.has(pid)) return null;
    visited.add(pid);
    const p=people.find(x=>x.id===pid);
    if(!p) return null;
    // Root (Kasirin) → return Kasirin itself
    if(p.baniId==='KSR-000') return p;
    const parents=getActiveParents(pid);
    if(!parents.length){
      // No parents → this person is either a Bani Head or unconnected
      // Check if they have a KSR spouse (married into Kasirin family)
      return null;
    }
    // Check if any parent is Kasirin (KSR-000) → this person IS a Bani Head
    const parentPeople=parents.map(id=>people.find(x=>x.id===id)).filter(Boolean);
    if(parentPeople.some(par=>par.baniId==='KSR-000'||par.baniId?.startsWith('KSR'))){
      return p; // this person is a direct child of Kasirin = Bani Head
    }
    // Walk up to parent's Bani Head
    for(const parentId of parents){
      const head=getBaniHead(parentId, visited);
      if(head) return head;
    }
    return null;
  }

  const baniLabel=useMemo(()=>{
    if(!people.length) return 'Bani Kasirin';
    if(!sel){
      return 'Bani Kasirin';
    }
    const selPerson=people.find(p=>p.id===sel);
    if(!selPerson) return 'Bani Kasirin';

    // Kasirin or their spouse → Bani Kasirin
    if(selPerson.baniId==='KSR-000'||selPerson.baniId==='KSR-W1'||
       selPerson.baniId?.match(/^KSR-W\d+$/)) return 'Bani Kasirin';

    // Try to find Bani Head via parent chain
    let head=getBaniHead(sel);

    // If not found (married-in, no parents set), try via partner
    if(!head){
      const partnerIds=getPartners(sel);
      for(const pid of partnerIds){
        head=getBaniHead(pid);
        if(head) break;
      }
    }

    if(!head) return 'Bani Kasirin';
    // If head is Kasirin himself → show Bani Kasirin
    if(head.baniId==='KSR-000') return 'Bani Kasirin';
    return `Bani ${nn(head)}`;
  },[sel,people,rels]);

  /* ── SEARCH ── */
  const searchRes=searchQ.length>1?people.filter(p=>p.fullName.toLowerCase().includes(searchQ.toLowerCase())||(p.nickname&&p.nickname.toLowerCase().includes(searchQ.toLowerCase()))).slice(0,8):[];
  function focusPerson(id){

  }

  const lines=buildLines();

  const bioParents=sel?getBioParents(sel):[];
  const partners=sel?getPartners(sel):[];
  const siblings=sel?getSiblings(sel):[];
  const childrenDisplay=sel?getChildrenForDisplay(sel):[];
  const adopted=sel?isAdopted(sel):false;

  function PChip({id,tag,onRm}){

  }

  return <>

    {!loading&&loadErr&&(

    {/* TOP BAR */}
    <div className="topbar">
      <div style={{flexShrink:0}}>

        <div className="brand-sub">Silsilah Keluarga</div>
      </div>
      <div className="sep"/>
      {/* Desktop search */}
      <div className="search-wrap">
        <input placeholder="Cari nama…" value={searchQ}
          onChange={e=>{setSearchQ(e.target.value);setShowSR(true);}}

    </div>

    {/* Mobile search expand overlay */}

    >

        <h3>⊞ Rapikan Otomatis</h3>
        <p className="modal-sub">Semua posisi kartu akan dihitung ulang menggunakan algoritma subtree per Bani. Posisi yang sudah kamu atur manual akan digantikan.</p>
        <div style={{background:'#f0f7ff',border:'1px solid #c0d8f0',borderRadius:8,padding:'8px 12px',fontSize:11,color:'#3060a0',marginBottom:14,lineHeight:1.6}}>
          ℹ️ Setelah rapikan, kamu tetap bisa drag kartu secara manual untuk fine-tuning.
        </div>
        <div className="frow">
          <button className="btn primary" onClick={computeAutoLayout}>Rapikan Sekarang</button>
          <button className="btn" onClick={()=>setModal(null)}>Batal</button>
        </div>
      </div>
    </div>}

    {/* ── ID REGISTRY PANEL ── */}
    {modal==='registry'&&<div className="overlay" onClick={()=>{setModal(null);setRegistryFilter(null);}}>
      <div className="modal" style={{maxWidth:420}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',alignItems:'center',marginBottom:14}}>
          <h3 style={{flex:1,marginBottom:0}}>ID Registry</h3>
          <button className="btn" style={{padding:'4px 10px',fontSize:11}} onClick={()=>{setModal(null);setRegistryFilter(null);}}>✕ Tutup</button>
        </div>
        {(()=>{
          // Build groups
          const groups={};
          people.forEach(p=>{
            if(!p.baniId){groups['?']=groups['?']||[];groups['?'].push(p);return;}
            const m=p.baniId.match(/^([A-Z]+)-/);
            const prefix=m?m[1]:'?';
            groups[prefix]=groups[prefix]||[];
            groups[prefix].push(p);
          });
          const sortedMembers=arr=>arr.sort((a,b)=>{
            const na=parseInt((a.baniId||'').replace(/\D/g,''))||999;
            const nb=parseInt((b.baniId||'').replace(/\D/g,''))||999;
            return na-nb;
          });

          // Bani prefixes = non-KSR, non-BARU, non-?
          const baniPrefixes=Object.keys(groups)
            .filter(k=>k!=='KSR'&&k!=='BARU'&&k!=='?')
            .sort();

          // Table renderer
          function MemberTable({members, color}){
            return(
              <table style={{width:'100%',borderCollapse:'collapse'}}>
                <tbody>
                  {sortedMembers([...members]).map(p=>(
                    <tr key={p.id} style={{borderBottom:'1px solid #f5f2ee'}}>
                      <td style={{fontFamily:'monospace',fontSize:11,fontWeight:700,color,
                        padding:'5px 10px 5px 0',whiteSpace:'nowrap',width:1}}>
                        {p.baniId||'—'}
                      </td>
                      <td style={{fontSize:12,color:'#2a2018',padding:'5px 0'}}>{nn(p)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            );
          }

          return <>
            {/* KSR — always shown */}
            {groups['KSR']&&(
              <div style={{marginBottom:16}}>
                <div style={{fontSize:9,fontWeight:800,letterSpacing:'.1em',textTransform:'uppercase',
                  color:'#6a5020',borderBottom:'2px solid #e8d8a0',paddingBottom:4,marginBottom:6}}>
                  🌳 Leluhur Utama (Kasirin)
                  <span style={{fontWeight:400,color:'#b0a898',marginLeft:6}}>{groups['KSR'].length} orang</span>
                </div>
                <MemberTable members={groups['KSR']} color="#8a6020"/>
              </div>
            )}

            {/* BARU — always shown if any */}
            {groups['BARU']&&(
              <div style={{marginBottom:16}}>
                <div style={{fontSize:9,fontWeight:800,letterSpacing:'.1em',textTransform:'uppercase',
                  color:'#a05030',borderBottom:'2px solid #f0d8c8',paddingBottom:4,marginBottom:6}}>
                  ⏳ Belum ada relasi orang tua
                  <span style={{fontWeight:400,color:'#b0a898',marginLeft:6}}>{groups['BARU'].length} orang</span>
                </div>
                <MemberTable members={groups['BARU']} color="#a05030"/>
              </div>
            )}

            {/* Bani selector */}
            {baniPrefixes.length>0&&(
              <div style={{marginBottom:registryFilter?12:0}}>
                <div style={{fontSize:9,fontWeight:800,letterSpacing:'.1em',textTransform:'uppercase',
                  color:'#4a7a9b',borderBottom:'2px solid #d0e4f0',paddingBottom:4,marginBottom:10}}>
                  Pilih Bani
                </div>
                <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                  {baniPrefixes.map(prefix=>(
                    <button key={prefix}
                      onClick={()=>setRegistryFilter(registryFilter===prefix?null:prefix)}
                      style={{
                        padding:'5px 12px',borderRadius:20,fontSize:11,fontWeight:700,
                        border:`1.5px solid ${registryFilter===prefix?'#4a7a9b':'#d0cbc2'}`,
                        background:registryFilter===prefix?'#4a7a9b':'#fff',
                        color:registryFilter===prefix?'#fff':'#4a7a9b',
                        cursor:'pointer',fontFamily:'inherit'
                      }}>
                      Bani {prefix}
                      <span style={{fontWeight:400,fontSize:10,marginLeft:4,opacity:.7}}>
                        {groups[prefix]?.length||0}
                      </span>
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* Selected Bani members */}
            {registryFilter&&groups[registryFilter]&&(
              <div style={{marginTop:12}}>
                <div style={{fontSize:9,fontWeight:800,letterSpacing:'.1em',textTransform:'uppercase',
                  color:'#4a7a9b',borderBottom:'2px solid #d0e4f0',paddingBottom:4,marginBottom:6}}>
                  Bani {registryFilter}
                  <span style={{fontWeight:400,color:'#b0a898',marginLeft:6}}>{groups[registryFilter].length} orang</span>
                </div>
                <MemberTable members={groups[registryFilter]} color="#4a7a9b"/>
              </div>
            )}
          </>;
        })()}
      </div>
    </div>}
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
