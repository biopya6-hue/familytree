/* ══════════════════════════════════════════
   ID SYSTEM
   - KSR-000  : Kasirin (root)
   - KSR-W1   : Istri ke-N Kasirin
   - BPJ-001  : keturunan darah Bani Panidjan
   - BPJ-002-X: masuk via pernikahan (luar darah)
   Prefix 3 huruf dari nama kepala Bani
══════════════════════════════════════════ */
function makePrefix(name){
  // Take up to 3 significant letters: skip spaces, take chars at pos 0,2,4 of cleaned name
  const clean=name.replace(/[^a-zA-Z]/g,'').toUpperCase();
  if(clean.length>=5) return clean[0]+clean[2]+clean[4];
  if(clean.length>=3) return clean[0]+clean[1]+clean[2];
  return clean.padEnd(3,'X');
}

function nextBaniId(prefix,people,isBlood){
  // Find all existing IDs with this prefix
  const re=new RegExp(`^${prefix}-(\\d+)(-X)?$`);
  const nums=people
    .map(p=>p.baniId||'')
    .map(id=>{ const m=id.match(re); return m?parseInt(m[1]):0; })
    .filter(n=>n>0);
  const next=(nums.length?Math.max(...nums):0)+1;
  const num=String(next).padStart(3,'0');
  return `${prefix}-${num}${isBlood?'':'-X'}`;
}

/* Determine the Bani prefix for a new person.
   Logic:
   1. If no active parents → they are a root/Bani head, get their own prefix
   2. If active parents exist → inherit prefix from the blood parent
   3. If the person has no blood link to Bani → use partner's prefix + -X
*/
function assignBaniId(person, allPeople, allRels, isBloodDescendant){
  // Special case: root ancestor
  if(person.id==='p0a') return 'KSR-000';
  if(person.id==='p0b') return 'KSR-W1';

  // Find which prefix to use
  // Walk up active parent chain to find Bani head
  function getBaniPrefix(pid, visited=new Set()){
    if(visited.has(pid)) return null;
    visited.add(pid);
    const p=allPeople.find(x=>x.id===pid);
    if(!p) return null;
    if(p.baniId){
      // Extract prefix from existing baniId
      const m=p.baniId.match(/^([A-Z]+)-/);
      return m?m[1]:null;
    }
    const parentRels=allRels.filter(r=>r.type==='parent-child'&&r.isActive&&r.pids[r.pids.length-1]===pid);
    if(!parentRels.length){
      // This person is a Bani head — make prefix from their name
      return makePrefix(p.fullName);
    }
    const bloodParent=parentRels[0].pids[0];
    return getBaniPrefix(bloodParent, visited);
  }

  const prefix=getBaniPrefix(person.id)||makePrefix(person.fullName);
  return nextBaniId(prefix, allPeople, isBloodDescendant);
}

  /* ── FIREBASE LOAD ── */
  useEffect(()=>{
    async function load(){
      try{
        const doc=await db.collection('silsilah').doc('bani-panidjan').get();
        if(doc.exists){
          const d=doc.data();
          setPeople(d.people||[]);

        console.error('Firebase load error:',err);

        try{
          const saved=JSON.parse(localStorage.getItem('silsilah_v7')||'null');
          if(saved){setPeople(saved.people);setRels(saved.rels);setPos(saved.pos);}
          else{setPeople(SP);setRels(SR);setPos({...SPOS});}
          setLoadErr('Offline — perubahan hanya tersimpan di perangkat ini.');
        }catch{setPeople(SP);setRels(SR);setPos({...SPOS});}
      } finally{setLoading(false);}
    }

  /* ── FIREBASE SAVE (debounced 1.5s) ── */
  useEffect(()=>{
    if(!people.length)return;

    localStorage.setItem('silsilah_v7',JSON.stringify({people,rels,pos}));

    if(saveTimer.current)clearTimeout(saveTimer.current);

        await db.collection('silsilah').doc('bani-panidjan').set({people,rels,pos});

  /* ── PHOTO UPLOAD to Firebase Storage ── */
  async function uploadPhoto(file, personId){
    if(!file)return null;
    setUploadPct(0);
    try{
      const ext=file.name.split('.').pop().toLowerCase();
      const ref=storage.ref(`photos/${personId}_${Date.now()}.${ext}`);
      const task=ref.put(file);
      await new Promise((res,rej)=>{
        task.on('state_changed',
          snap=>setUploadPct(Math.round(snap.bytesTransferred/snap.totalBytes*100)),
          rej, res
        );
      });
      const url=await ref.getDownloadURL();
      setUploadPct(null);
      return url;
    }catch(err){
      console.error('Upload error:',err);
      setUploadPct(null);
      return null;
    }
  }
  useEffect(()=>{
    if(!people.length||!vpRef.current)return;
    const vw=vpRef.current.clientWidth,vh=vpRef.current.clientHeight;
    setVt({s:0.55,x:vw/2-(1080+CW/2)*0.55,y:vh/2-(80+CH/2)*0.55});
  },[people.length]);

  const selP=people.find(p=>p.id===sel)||null;

  /* ── ALL VISIBLE (3-gen-focus removed) ── */
  const visibleIds = useMemo(()=>new Set(people.map(p=>p.id)),[people]);

  /* ── RELATION HELPERS ── */
  function getActiveParents(pid){
    const rs=rels.filter(r=>r.type==='parent-child'&&r.isActive&&r.pids[r.pids.length-1]===pid);
    return [...new Set(rs.flatMap(r=>r.pids.slice(0,-1)))];
  }
  function getBioParents(pid){
    const rs=rels.filter(r=>r.type==='parent-child'&&!r.isActive&&r.pids[r.pids.length-1]===pid);
    return [...new Set(rs.flatMap(r=>r.pids.slice(0,-1)))];
  }
  function isAdopted(pid){
    return rels.some(r=>r.type==='parent-child'&&!r.isActive&&r.pids[r.pids.length-1]===pid)&&
           rels.some(r=>r.type==='parent-child'&&r.isActive&&r.pids[r.pids.length-1]===pid);
  }
  function getBioChildren(pid){
    return rels.filter(r=>r.type==='parent-child'&&r.pids.slice(0,-1).includes(pid)).map(r=>r.pids[r.pids.length-1]);
  }
  function getActiveChildren(pid){
    return rels.filter(r=>r.type==='parent-child'&&r.isActive&&r.pids.slice(0,-1).includes(pid)).map(r=>r.pids[r.pids.length-1]);
  }
  function getPartners(pid){
    return rels.filter(r=>r.type==='married'&&r.pids.includes(pid)).flatMap(r=>r.pids.filter(x=>x!==pid));
  }
  function getActivePartner(pid){
    // find the "other" active partner in a marriage (for auto-detect)
    const marriages=rels.filter(r=>r.type==='married'&&r.pids.includes(pid));
    // prefer non-cerai partner
    for(const m of marriages){
      const other=m.pids.find(x=>x!==pid);
      const op=people.find(p=>p.id===other);
      if(op&&op.status!=='Cerai') return other;
    }
    return marriages[0]?.pids.find(x=>x!==pid)||null;
  }
  function getSiblings(pid){
    const sibs=new Set();
    const myParents=[...getActiveParents(pid),...getBioParents(pid)];
    rels.forEach(r=>{
      if(r.type==='parent-child'){
        const parents=r.pids.slice(0,-1),child=r.pids[r.pids.length-1];
        if(child===pid)return;
        if(parents.some(p=>myParents.includes(p)))sibs.add(child);
      }
    });
    const actPar=getActiveParents(pid);
    rels.forEach(r=>{
      if(r.type==='parent-child'&&r.isActive){
        const parents=r.pids.slice(0,-1),child=r.pids[r.pids.length-1];
        if(child===pid)return;
        if(parents.some(p=>actPar.includes(p)))sibs.add(child);
      }
    });
    return [...sibs];
  }
  function getChildrenForDisplay(pid){
    const bio=[...new Set(getBioChildren(pid))];
    const act=[...new Set(getActiveChildren(pid))];
    const shown=new Set([...bio,...act]);
    return [...shown].map(cid=>({
      id:cid,
      tag:bio.includes(cid)&&!act.includes(cid)?'adopted':!bio.includes(cid)&&act.includes(cid)?'asuh':undefined
    }));
  }

  /* ── CONNECTORS ── */
  function buildLines(){
    const lines=[],drawn=new Set();
    rels.forEach(r=>{
      if(r.type==='married'){
        const[a,b]=r.pids;
        const pa=pos[a],pb=pos[b];if(!pa||!pb)return;
        if(!visibleIds.has(a)||!visibleIds.has(b))return;
        const key=[a,b].sort().join('-');
        if(drawn.has(key))return;drawn.add(key);
        const x1=CX(pa),y1=CY(pa),x2=CX(pb),y2=CY(pb);
        lines.push({rid:r.id,d:curve(x1,y1,x2,y2,true),stroke:'#c8a870',dash:'7 4',w:2.5,mx:(x1+x2)/2,my:(y1+y2)/2,label:'Pasangan',type:'married',active:true});
      }
      if(r.type==='parent-child'&&r.isActive){
        const pids=r.pids.slice(0,-1),cid=r.pids[r.pids.length-1];
        const pc=pos[cid];if(!pc)return;
        if(!visibleIds.has(cid))return;
        const valid=pids.filter(x=>pos[x]&&visibleIds.has(x));if(!valid.length)return;
        const sx=valid.reduce((s,x)=>s+CX(pos[x]),0)/valid.length;
        const sy=valid.reduce((s,x)=>s+CY(pos[x]),0)/valid.length;
        lines.push({rid:r.id,d:curve(sx,sy,CX(pc),CY(pc),false),stroke:'#90a8b8',dash:undefined,w:2.5,mx:(sx+CX(pc))/2,my:(sy+CY(pc))/2,label:'Orang tua → Anak',type:'parent-child',active:r.isActive});
      }
    });
    return lines;
  }

  /* ── PAN / ZOOM ── */
  const vpTop = 50; // topbar height
  function vpDown(e){if(e.target!==vpRef.current)return;panning.current=true;panStart.current={x:e.clientX-vt.x,y:e.clientY-vt.y};}
  function vpMove(e){
    if(dragging.current){
      e.preventDefault();
      setPos(p=>({...p,[dragging.current]:{x:e.clientX/vt.s-dragOff.current.x,y:(e.clientY-vpTop)/vt.s-dragOff.current.y}}));
      return;
    }
    if(!panning.current)return;
    setVt(t=>({...t,x:e.clientX-panStart.current.x,y:e.clientY-panStart.current.y}));
  }
  function vpUp(){panning.current=false;dragging.current=null;}

  /* ── WHEEL ZOOM (fix: use ref to avoid stale closure) ── */
  const vtRef=useRef(vt);
  useEffect(()=>{vtRef.current=vt;},[vt]);
  useEffect(()=>{
    const el=vpRef.current;if(!el)return;
    function onWheel(e){
      e.preventDefault();
      const t=vtRef.current;
      const f=e.deltaY<0?1.12:0.9;
      const ns=Math.min(Math.max(t.s*f,0.15),4);
      const rect=el.getBoundingClientRect();
      const mx=e.clientX-rect.left,my=e.clientY-rect.top;
      setVt({s:ns,x:mx-(mx-t.x)*(ns/t.s),y:my-(my-t.y)*(ns/t.s)});
    }
    el.addEventListener('wheel',onWheel,{passive:false});
    return()=>el.removeEventListener('wheel',onWheel);
  },[]);

  /* ── TOUCH PAN / PINCH-ZOOM ── */
  const lastTouch=useRef(null);   // {x,y} origin for pan (offset from vt)
  const lastPinch=useRef(null);   // pinch anchor snapshot
  const touchStartPos=useRef(null); // raw start clientX/Y for tap detection
  const TAP_SLOP=8; // px — movement within this = tap, not drag

  function onTouchStart(e){
    // Never intercept interactive UI elements or overlay panels
    const tag=e.target.tagName;
    if(tag==='BUTTON'||tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||tag==='A')return;
    if(e.target.closest('.sidebar,.modal,.overlay,.ctrl,.legend,.statpill,.topbar,.sresults,.edge-popup'))return;

    if(e.touches.length===1){
      const t=e.touches[0];
      touchStartPos.current={x:t.clientX,y:t.clientY};
      lastTouch.current={x:t.clientX-vtRef.current.x,y:t.clientY-vtRef.current.y};
      lastPinch.current=null;
      // Don't preventDefault yet — let potential tap/click events fire normally
    } else if(e.touches.length>=2){
      e.preventDefault(); // pinch always captured
      const t0=e.touches[0],t1=e.touches[1];
      const dx=t0.clientX-t1.clientX, dy=t0.clientY-t1.clientY;
      lastPinch.current={
        dist:Math.hypot(dx,dy),
        s:vtRef.current.s,
        x:vtRef.current.x,
        y:vtRef.current.y,
        mx:(t0.clientX+t1.clientX)/2,
        my:(t0.clientY+t1.clientY)/2,
      };
      lastTouch.current=null;
      touchStartPos.current=null;
    }
  }
  function onTouchMove(e){
    if(e.touches.length===1&&lastTouch.current){
      const t=e.touches[0];
      const sp=touchStartPos.current;
      const moved=sp?Math.hypot(t.clientX-sp.x,t.clientY-sp.y):TAP_SLOP+1;
      if(moved<TAP_SLOP)return; // still within tap slop — don't pan yet
      e.preventDefault(); // only preventDefault once we're actually panning
      const nx=t.clientX-lastTouch.current.x;
      const ny=t.clientY-lastTouch.current.y;
      if(isFinite(nx)&&isFinite(ny)) setVt(prev=>({...prev,x:nx,y:ny}));
    } else if(e.touches.length>=2&&lastPinch.current){
      e.preventDefault();
      const t0=e.touches[0],t1=e.touches[1];
      const dx=t0.clientX-t1.clientX, dy=t0.clientY-t1.clientY;
      const dist=Math.hypot(dx,dy);
      if(!dist)return;
      const ratio=dist/lastPinch.current.dist;
      const ns=Math.min(Math.max(lastPinch.current.s*ratio,0.15),4);
      const {mx,my,x:ox,y:oy,s:os}=lastPinch.current;
      const nx=mx-(mx-ox)*(ns/os);
      const ny=my-(my-oy)*(ns/os);
      if(isFinite(ns)&&isFinite(nx)&&isFinite(ny)) setVt({s:ns,x:nx,y:ny});
    }
  }
  function onTouchEnd(e){
    if(e.touches.length===0){
      lastTouch.current=null;lastPinch.current=null;touchStartPos.current=null;
    } else if(e.touches.length===1){
      const t=e.touches[0];
      lastTouch.current={x:t.clientX-vtRef.current.x,y:t.clientY-vtRef.current.y};
      lastPinch.current=null;
      touchStartPos.current={x:t.clientX,y:t.clientY};
    }
  }
  useEffect(()=>{
    const el=vpRef.current;if(!el)return;
    // touchstart passive:true so we don't block scroll/tap until we decide it's a drag
    el.addEventListener('touchstart',onTouchStart,{passive:true});
    el.addEventListener('touchmove',onTouchMove,{passive:false});
    el.addEventListener('touchend',onTouchEnd,{passive:true});
    return()=>{
      el.removeEventListener('touchstart',onTouchStart);
      el.removeEventListener('touchmove',onTouchMove);
      el.removeEventListener('touchend',onTouchEnd);
    };
  },[]);

  function nodeDown(e,id){if(!isAdmin)return;e.stopPropagation();dragging.current=id;const p=pos[id]||{x:0,y:0};dragOff.current={x:e.clientX/vt.s-p.x,y:(e.clientY-vpTop)/vt.s-p.y};}

    if(!file)return;

  }

  /* ── ADD RELATION with auto-detect partner ── */
  function prepareAddRel(){
    if(!relF.pid||!sel)return;
    const isActive=!!relF.isActive;
    if(relF.type==='married'){
      setRels(prev=>[...prev,{id:'r'+Date.now(),type:'married',pids:[sel,relF.pid],isActive:true}]);
      setRelF({type:'married',pid:'',isActive:true});setModal(null);return;
    }
    // parent-child: determine parent(s)
    let parentIds=[], childId='';
    if(relF.type==='child-of'){
      // sel is child, relF.pid is one parent
      parentIds=[relF.pid]; childId=sel;
    } else {
      // sel is parent, relF.pid is child
      parentIds=[sel]; childId=relF.pid;
    }
    // auto-detect partner of the parent(s)
    const mainParent=parentIds[0];
    const partner=getActivePartner(mainParent);
    if(partner&&partner!==childId){
      // ask for confirmation
      setPendingRel({parentIds:[mainParent,partner],childId,isActive});
      setModal('confirm-parents');
    } else {
      // single parent only
      commitRel([mainParent],childId,isActive);
      setRelF({type:'married',pid:'',isActive:true});setModal(null);
    }
  }
  function commitRel(parentIds,childId,isActive){
    setRels(prev=>[...prev,{id:'r'+Date.now(),type:'parent-child',pids:[...parentIds,childId],isActive}]);
  }
  function confirmBothParents(){

            <div className="photo-upload-wrap">
              <input type="text" value={editF.photo||''} placeholder="Paste URL foto atau klik Upload →"
                onChange={e=>setEditF(f=>({...f,photo:e.target.value}))}/>
              <button className="upload-btn" disabled={uploadTarget==='edit'}
                onClick={()=>{setUploadTarget('edit');fileInputRef.current?.click();}}>
                {uploadTarget==='edit'?'Uploading…':'📷 Upload'}
              </button>
            </div>
            {uploadTarget==='edit'&&uploadPct!==null&&(
              <div className="upload-progress">
                <span>{uploadPct}%</span>
                <div className="upload-bar-wrap"><div className="upload-bar" style={{width:uploadPct+'%'}}/></div>
              </div>
            )}
          </div>
          <div className="fg"><label>Jenis Kelamin</label>
            <select value={editF.gender||'M'} onChange={e=>setEditF(f=>({...f,gender:e.target.value}))}>
              <option value="M">Laki-laki</option><option value="F">Perempuan</option>
            </select>
          </div>
          <div className="fg"><label>Status</label>
            <select value={editF.status||'Hidup'} onChange={e=>setEditF(f=>({...f,status:e.target.value}))}>
              <option>Hidup</option><option>Wafat</option><option>Cerai</option>
            </select>
          </div>
          <div className="fg"><label>Catatan</label>
            <textarea value={editF.notes||''} onChange={e=>setEditF(f=>({...f,notes:e.target.value}))}/>
          </div>
          <div className="fg">
            <label>Catatan Orang Tua <span style={{fontWeight:400,color:'#b0a898'}}>(misal: keterangan kandung/tiri/asuh)</span></label>
            <textarea value={editF.bioNote||''} placeholder="contoh: Orang tua kandung: Edi & Sandra" onChange={e=>setEditF(f=>({...f,bioNote:e.target.value}))}/>
          </div>
          <div className="frow">
            <button className="btn primary" onClick={saveEdit}>Simpan</button>
            <button className="btn" onClick={()=>setSbMode('view')}>Batal</button>
          </div>
        </div>
      </>}
    </div>

    <div className={`ctrl${sel?' sb-open':''}`}>
      <button className="cbtn" onClick={()=>setVt(t=>({...t,s:Math.min(t.s*1.2,4)}))}>+</button>
      <button className="cbtn" onClick={()=>setVt(t=>({...t,s:Math.max(t.s*.83,0.15)}))}>−</button>
      <button className="cbtn" onClick={fullReset} style={{fontSize:13}}>⌂</button>
    </div>

    <div className={`legend${sel?' sb-open':''}`}>
      <div className="li"><svg width="22" height="10"><path d="M2,8 C2,4 20,4 20,8" stroke="#90a8b8" strokeWidth="2.5" fill="none" strokeLinecap="round"/></svg>Orang tua — Anak</div>
      <div className="li"><svg width="22" height="10"><path d="M2,5 C8,2 14,8 20,5" stroke="#c8a870" strokeWidth="2.5" strokeDasharray="6 3" fill="none" strokeLinecap="round"/></svg>Pasangan</div>
      <div className="li"><div style={{width:8,height:8,borderRadius:'50%',background:'#6ea8d4'}}/> Laki-laki</div>
      <div className="li"><div style={{width:8,height:8,borderRadius:'50%',background:'#d47ea8'}}/> Perempuan</div>
      {isAdmin&&<div className="li" style={{marginTop:4,paddingTop:4,borderTop:'1px solid #f0ebe4',color:'#9a9080',fontStyle:'italic'}}>Klik garis untuk edit relasi</div>}
    </div>

    {/* SAVE STATUS / STAT PILL */}
    <div className={`save-status${sel?' hidden':''}`}>
      <div className={`save-dot ${saveStatus}`}/>
      {saveStatus==='syncing'&&<span style={{color:'#8a6020'}}>Menyimpan…</span>}
      {saveStatus==='saved'&&<span style={{color:'#7a7060'}}>{people.length} orang · {rels.filter(r=>r.type==='married').length} pasangan · {people.filter(p=>p.status==='Wafat').length} wafat</span>}
      {saveStatus==='error'&&<span style={{color:'#a03030'}}>Gagal simpan — cek koneksi</span>}
    </div>

    {/* ROTATE HINT OVERLAY */}
    {showRotHint&&(
      <div className="rot-overlay" onClick={()=>setShowRotHint(false)}>
        <div className="rot-icon">📱</div>
        <div className="rot-title">Putar layar untuk tampilan lebih luas</div>
        <div className="rot-sub">Gunakan mode landscape (horizontal) agar pohon keluarga lebih nyaman dilihat di HP.</div>
        <button className="rot-close" onClick={()=>setShowRotHint(false)}>Oke, mengerti</button>
      </div>
    )}

    {/* ── MODALS ── */}
    {modal==='pin'&&<div className="overlay" onClick={()=>{setModal(null);setPinVal('');setPinErr('');}}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>Login Admin</h3>
        <p className="modal-sub">Masukkan PIN untuk mengaktifkan mode edit.</p>
        <div className="fg"><label>PIN</label>
          <input type="password" value={pinVal} autoFocus onChange={e=>setPinVal(e.target.value)} onKeyDown={e=>e.key==='Enter'&&tryPin()}/>
          {pinErr&&<div style={{color:'#a03030',fontSize:11,marginTop:4}}>{pinErr}</div>}
        </div>
        <div className="frow">
          <button className="btn primary" onClick={tryPin}>Masuk</button>
          <button className="btn" onClick={()=>{setModal(null);setPinVal('');setPinErr('');}}>Batal</button>
        </div>
      </div>
    </div>}

    {modal==='delconfirm'&&<div className="overlay">
      <div className="modal">
        <h3>Hapus Anggota?</h3>
        <p className="modal-sub">Hapus <strong>{selP?.fullName}</strong>? Semua relasi terkait juga dihapus dan tidak bisa dibatalkan.</p>
        <div className="frow">
          <button className="btn danger" onClick={delPerson}>Ya, Hapus</button>
          <button className="btn" onClick={()=>setModal(null)}>Batal</button>
        </div>
      </div>
    </div>}

    {modal==='addrel'&&<div className="overlay" onClick={()=>{setModal(null);setRelSearchQ('');}}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>Tambah Relasi</h3>
        <p className="modal-sub">Untuk: <strong>{selP?.fullName}</strong></p>
        <div className="fg"><label>Jenis Relasi</label>
          <select value={relF.type} onChange={e=>setRelF(f=>({...f,type:e.target.value}))}>
            <option value="married">Pasangan / Menikah</option>
            <option value="parent-of">Orang tua dari (orang dipilih = anaknya)</option>
            <option value="child-of">Anak dari (orang dipilih = orang tuanya)</option>
          </select>
        </div>
        {relF.type!=='married'&&<div className="fg"><label>Status Pengasuh</label>
          <select value={relF.isActive?'1':'0'} onChange={e=>setRelF(f=>({...f,isActive:e.target.value==='1'}))}>
            <option value="1">Aktif (pengasuh saat ini)</option>
            <option value="0">Tidak aktif (biologis / historis)</option>
          </select>
        </div>}
        <div className="fg">
          <label>Pilih Orang {relF.pid&&<span style={{color:'#4a7a9b',fontWeight:700}}>✓ {nn(people.find(p=>p.id===relF.pid)||{fullName:''})}</span>}</label>
          <div className="ppicker">
            <div className="ppicker-search">
              <span className="pps-ico">🔍</span>
              <input
                autoFocus
                placeholder="Ketik nama untuk cari…"
                value={relSearchQ}
                onChange={e=>setRelSearchQ(e.target.value)}
              />
              {relSearchQ&&<span style={{cursor:'pointer',color:'#b0a898',fontSize:13}} onClick={()=>setRelSearchQ('')}>✕</span>}
            </div>
            <div className="ppicker-list">
              {(()=>{
                const q=relSearchQ.trim().toLowerCase();
                const filtered=people
                  .filter(p=>p.id!==sel)
                  .filter(p=>!q||p.fullName.toLowerCase().includes(q)||(p.nickname&&p.nickname.toLowerCase().includes(q)))
                  .sort((a,b)=>{
                    // selected first, then alphabetical by nickname
                    if(a.id===relF.pid)return -1;if(b.id===relF.pid)return 1;
                    return nn(a).localeCompare(nn(b),'id');
                  });
                if(!filtered.length)return <div className="ppicker-empty">Tidak ada hasil untuk "{relSearchQ}"</div>;
                return filtered.map(p=>(
                  <div key={p.id}
                    className={`ppicker-item${relF.pid===p.id?' selected':''}`}
                    onClick={()=>setRelF(f=>({...f,pid:p.id}))}>
                    <div className="pi-dot" style={{background:MC(p.gender)}}/>
                    <span className="pi-nick">{nn(p)}</span>
                    {p.fullName!==nn(p)&&<span className="pi-full">{p.fullName}</span>}
                    {p.status!=='Hidup'&&<span style={{marginLeft:'auto',fontSize:9,fontWeight:700,color:p.status==='Wafat'?'#a05030':'#705090'}}>{p.status}</span>}
                  </div>
                ));
              })()}
            </div>
          </div>
        </div>
        <div className="frow">
          <button className="btn primary" onClick={()=>{prepareAddRel();setRelSearchQ('');}} disabled={!relF.pid}>Tambah</button>
          <button className="btn" onClick={()=>{setModal(null);setRelSearchQ('');}}>Batal</button>
        </div>
      </div>
    </div>}

    {modal==='confirm-parents'&&pendingRel&&(()=>{
      const p1=people.find(x=>x.id===pendingRel.parentIds[0]);
      const p2=people.find(x=>x.id===pendingRel.parentIds[1]);
      const ch=people.find(x=>x.id===pendingRel.childId);
      return(
        <div className="overlay">
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3>Konfirmasi Orang Tua</h3>
            <p className="modal-sub">Ditemukan pasangan aktif dari <strong>{p1?nn(p1):''}</strong>:</p>
            <div className="confirm-box">
              <strong>{p2?nn(p2):''}</strong> terdeteksi sebagai pasangan aktif {p1?nn(p1):''}.<br/>
              Apakah <strong>{ch?nn(ch):''}</strong> adalah anak dari <strong>keduanya</strong>?
            </div>
            <div className="frow" style={{flexDirection:'column',gap:6}}>
              <button className="btn primary" onClick={confirmBothParents}>
                Ya, anak dari {p1?nn(p1):''} &amp; {p2?nn(p2):''}
              </button>
              <button className="btn" onClick={confirmSingleParent}>
                Tidak, anak dari {p1?nn(p1):''} saja
              </button>
              <button className="btn" onClick={()=>{setPendingRel(null);setModal('addrel');}}>Batal</button>
            </div>
          </div>
        </div>
      );
    })()}

    {modal==='addperson'&&<div className="overlay" onClick={()=>setModal(null)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>Tambah Anggota Baru</h3>
        <div className="fg"><label>Nama Lengkap *</label><input value={addF.fullName} autoFocus onChange={e=>setAddF(f=>({...f,fullName:e.target.value}))}/></div>
        <div className="fg"><label>Nama Panggilan</label><input value={addF.nickname} placeholder={addF.fullName.split(' ')[0]||'opsional'} onChange={e=>setAddF(f=>({...f,nickname:e.target.value}))}/></div>
        <div className="fg"><label>Jenis Kelamin</label>
          <select value={addF.gender} onChange={e=>setAddF(f=>({...f,gender:e.target.value}))}>
            <option value="M">Laki-laki</option><option value="F">Perempuan</option>
          </select>
        </div>
        <div className="fg"><label>Status</label>
          <select value={addF.status} onChange={e=>setAddF(f=>({...f,status:e.target.value}))}>
            <option>Hidup</option><option>Wafat</option><option>Cerai</option>
          </select>
        </div>
        <div className="fg"><label>Garis Darah</label>
          <select value={addF.isBlood?'1':'0'} onChange={e=>setAddF(f=>({...f,isBlood:e.target.value==='1'}))}>
            <option value="1">Darah — keturunan langsung Bani</option>
            <option value="0">Luar — masuk via pernikahan (ID akan berakhiran -X)</option>
          </select>
        </div>
        <div className="fg"><label>Tempat Lahir</label><input value={addF.birthPlace} placeholder="contoh: Blitar" onChange={e=>setAddF(f=>({...f,birthPlace:e.target.value}))}/></div>
        <div className="fg"><label>Tanggal Lahir</label><input type="date" value={addF.birthDate} onChange={e=>setAddF(f=>({...f,birthDate:e.target.value}))}/></div>
        <div className="fg"><label>Domisili</label><input value={addF.domicile} placeholder="contoh: Malang, Jawa Timur" onChange={e=>setAddF(f=>({...f,domicile:e.target.value}))}/></div>
        <div className="fg">
          <label>Foto <span style={{fontWeight:400,color:'#b0a898'}}>(opsional)</span></label>
          <div className="photo-upload-wrap">
            <input type="text" value={addF.photo} placeholder="Paste URL atau klik Upload →"
              onChange={e=>setAddF(f=>({...f,photo:e.target.value}))}/>
            <button className="upload-btn" disabled={uploadTarget==='add'}
              onClick={()=>{setUploadTarget('add');fileInputRef.current?.click();}}>
              {uploadTarget==='add'?'Uploading…':'📷 Upload'}
            </button>
          </div>
          {uploadTarget==='add'&&uploadPct!==null&&(
            <div className="upload-progress">
              <span>{uploadPct}%</span>
              <div className="upload-bar-wrap"><div className="upload-bar" style={{width:uploadPct+'%'}}/></div>
            </div>
          )}
        </div>
        <div className="fg"><label>Catatan</label><textarea value={addF.notes} onChange={e=>setAddF(f=>({...f,notes:e.target.value}))}/></div>
        <div className="fg">
          <label>Catatan Orang Tua <span style={{fontWeight:400,color:'#b0a898'}}>(opsional)</span></label>
          <textarea value={addF.bioNote} placeholder="contoh: Orang tua kandung: ..." onChange={e=>setAddF(f=>({...f,bioNote:e.target.value}))}/>
        </div>
        <div className="frow">
          <button className="btn primary" onClick={addPerson} disabled={!addF.fullName.trim()}>Tambah</button>
          <button className="btn" onClick={()=>setModal(null)}>Batal</button>
        </div>
      </div>
    </div>}
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
