  p_pan_2a: {x:900, y:400}, p_pan_2a_w1: {x:1060, y:400},
  p_pan_2b: {x:1280, y:400}, p_pan_2b_w1: {x:1440, y:400},
  p_pan_2c: {x:1660, y:400},
  p_pan_2d: {x:1880, y:400}, p_pan_2d_w1: {x:1720, y:400}, p_pan_2d_w2: {x:2040, y:400},
  p_pan_2e: {x:2320, y:400}, p_pan_2e_w1: {x:2480, y:400},
  p_pan_2f: {x:2680, y:400}, p_pan_2f_w1: {x:2840, y:400},
  p_pan_2g: {x:3040, y:400}, p_pan_2g_w1: {x:3200, y:400},
  p_pan_3a: {x:900, y:600}, p_pan_3b: {x:1060, y:600},
  p_pan_3c: {x:1280, y:600}, p_pan_3c_w1: {x:1440, y:600},
  p_pan_3d: {x:1660, y:600},
  p_pan_3e: {x:1720, y:600}, p_pan_3f: {x:1960, y:600}, p_pan_3g: {x:2120, y:600},
  p_pan_3h: {x:2400, y:600}, p_pan_3i: {x:2760, y:600}, p_pan_3j: {x:3120, y:600},
  p_pan_4a: {x:1360, y:800},
  p_sur_1: {x:3600, y:200}, p_sur_1_w1: {x:3440, y:200}, p_sur_1_w2: {x:3760, y:200},
  p_sur_2: {x:3680, y:400}
};

/* ── APP ── */
function App(){
  const [people,setPeople] = useState([]);
  const [rels,setRels]     = useState([]);
  const [pos,setPos]       = useState({});
  const [vt,setVt]         = useState({x:0,y:0,s:1});
  const vpRef=useRef();

  // Load state
  useEffect(()=>{
    // Di real app, gunakan db.collection('...').get()
    // Karena ini wipeout, kita load langsung dari SP
    setPeople(SP); setRels(SR); setPos(SPOS);
    
    // Auto-Kamera menyesuaikan layar (Fase 4)
    setTimeout(()=>{
      if(vpRef.current){
        const isMobile = window.innerWidth < 600;
        const scale = isMobile ? 0.35 : 0.6; // Kamera pintar
        const root = SPOS['p_ksr'];
        setVt({ 
          s: scale, 
          x: (window.innerWidth/2) - (root.x * scale), 
          y: (window.innerHeight/4) - (root.y * scale) 
        });
      }
    }, 100);
  },[]);

  // ══════════════════════════════════════════════════
  // FASE 4: GARIS SIKU (Orthogonal / Stepped)
  // ══════════════════════════════════════════════════
  function buildOrthogonalLines(){
    const lines=[], drawn=new Set();
    rels.forEach(r=>{
      if(r.type==='married'){
        const [a,b] = r.pids;
        const pa=pos[a], pb=pos[b]; if(!pa||!pb) return;
        const key = [a,b].sort().join('-');
        if(drawn.has(key)) return; drawn.add(key);
        
        // Garis Lurus Sederhana untuk Pasangan (Minimalis)
        const x1=CX(pa), y1=CY(pa), x2=CX(pb), y2=CY(pb);
        lines.push({d: `M${x1},${y1} L${x2},${y2}`, stroke:'#c8a870', dash:'6 4', w:2.5});
      }
      if(r.type==='parent-child' && r.isActive){
        const pids = r.pids.slice(0,-1), cid = r.pids[r.pids.length-1];
        const pc=pos[cid]; if(!pc) return;
        const valid = pids.filter(x=>pos[x]); if(!valid.length) return;
        
        // Titik awal orang tua (tengah-tengah jika 2 orang)
        const sx = valid.reduce((s,x)=>s+CX(pos[x]),0)/valid.length;
        const sy = valid.reduce((s,x)=>s+CY(pos[x]),0)/valid.length;
        
        // Orthogonal: Turun 40px, Belok Kiri/Kanan, Turun ke Anak
        const midY = sy + (CH/2) + 30; // Turun ke area kosong
        const ex = CX(pc), ey = CY(pc) - (CH/2); // Nancap di ubun-ubun anak
        
        const path = `M${sx},${sy} L${sx},${midY} L${ex},${midY} L${ex},${ey}`;
        lines.push({d: path, stroke:'#90a8b8', dash:undefined, w:2});
      }
    });
    return lines;
  }
  const lines = buildOrthogonalLines();

  // PAN & ZOOM
  const panning=useRef(false), panStart=useRef({});
  function vpDown(e){ panning.current=true; panStart.current={x:e.clientX-vt.x, y:e.clientY-vt.y}; }
  function vpMove(e){ if(panning.current) setVt(t=>({...t, x:e.clientX-panStart.current.x, y:e.clientY-panStart.current.y})); }
  function vpUp(){ panning.current=false; }
  
  // Wheel Zoom
  useEffect(()=>{
    const el=vpRef.current; if(!el) return;
    function onWheel(e){
      e.preventDefault();
      setVt(t=>{
        const f = e.deltaY<0 ? 1.1 : 0.9;
        const ns = Math.min(Math.max(t.s*f, 0.15), 3);
        const rect = el.getBoundingClientRect();
        const mx = e.clientX-rect.left, my = e.clientY-rect.top;
        return {s:ns, x:mx-(mx-t.x)*(ns/t.s), y:my-(my-t.y)*(ns/t.s)};
      });
    }
    el.addEventListener('wheel',onWheel,{passive:false});
    return()=>el.removeEventListener('wheel',onWheel);
  },[]);

  // ══════════════════════════════════════════════════
  // FASE 3: Logika Bisnis (Simulasi Fungsi)
  // ══════════════════════════════════════════════════
  // Contoh implementasi sederhana tanpa regex:
  // function addPerson(data) {
  //   const newPerson = { id: 'p_'+Date.now(), isBlood: true, bani: null, spouseOrder: null, ...data };
  //   setPeople(p => [...p, newPerson]);
  // }
  // function commitMarriage(hostId, newcomerId) {
  //   // newcomer.isBlood = false; newcomer.bani = host.bani; newcomer.spouseOrder = hitung_istri + 1;
  // }

  return (
    <>
      <div className="topbar">
        <div>
          <div className="brand-name">Bani Kasirin</div>
          <div className="brand-sub">Silsilah Keluarga</div>
        </div>
        <div className="spacer"/>
        <button className="btn accent">⊞ Rapikan</button>
        <button className="btn">🪪 Registry</button>
      </div>

      <div id="vp" ref={vpRef} onMouseDown={vpDown} onMouseMove={vpMove} onMouseUp={vpUp} onMouseLeave={vpUp}>
        <div id="world" style={{transform:`translate(${vt.x}px,${vt.y}px) scale(${vt.s})`}}>
          
          {/* SVG Garis Orthogonal */}
          <svg id="csvg">
            {lines.map((l,i)=>(
              <path key={i} d={l.d} stroke={l.stroke} strokeWidth={l.w} strokeDasharray={l.dash} fill="none"/>
            ))}
          </svg>

          {/* Node Kartu (Estetika Minimalis) */}
          {people.map(p=>{
            const pp=pos[p.id]; if(!pp) return null;
            return (
              <div key={p.id} className="node" style={{left:pp.x, top:pp.y, width:CW}}>
                <div className={`card ${p.status==='Wafat'?'wafat':''}`}>
                  <div className="gaccent" style={{background:MC(p.gender)}}/>
                  <div className="avatar" style={{background:MB(p.gender)}}>
                    <span style={{color:MC(p.gender)}}>{ini(p.fullName)}</span>
                  </div>
                  <div className="card-nick">{nn(p)}</div>
                  {p.status==='Wafat'&&<div style={{fontSize:9, color:'#8a8278', marginTop:2}}>Wafat</div>}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
